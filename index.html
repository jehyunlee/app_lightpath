  const saveCleared = () => { try { localStorage.setItem('physics-lab-cleared', JSON.stringify([...cleared])); } catch (e) { /* 무시 */ } };

  function freshState(mode, stage) {
    return {
      mode, stage, objs: [], inv: {}, sel: null, won: false, overlay: false,
      hintStep: 0, placed: false, revealed: false,
      lab: { spectrum: 'white', lambda: 470, wide: false, gap: 22 },
    };
  }

  function loadStage(i) {
    const st = STAGES[i];
    S = freshState('stage', i);
    S.objs = st.fixed.map(o => ({ ...o, params: { ...(o.params || {}) }, id: uid++, locked: true }));
    S.inv = { ...st.inventory };
    afterLoad();
    hideClear();
  }

  function loadLab() {
    S = freshState('lab', 0);
    S.objs = [
      { type: 'source', x: 80, y: 320, rot: 0, params: {}, label: '광원', id: uid++, locked: false },
      { type: 'sensor', x: 900, y: 320, rot: 0, params: { len: 120 }, label: '센서', id: uid++, locked: false },
    ];
    LAB_PARTS.forEach(t => { S.inv[t] = Infinity; });
    applyLabSource();
    afterLoad();
  }

  function afterLoad() {
    clearTimeout(winTimer);
    buildPanel();
    updateNav();
    updateStatus();
    retrace();
  }

  const selObj = () => S.objs.find(o => o.id === S.sel) || null;

  function applyLabSource() {
    const src = S.objs.find(o => o.type === 'source');
    const L = S.lab;
    src.params = {
      spectrum: L.spectrum === 'mono' ? 'mono' : 'white', lambda: L.lambda,
      width: L.wide ? 70 : 0, rays: L.wide ? 7 : 1,
    };
    src.label = L.spectrum === 'mono' ? `단색광 ${L.lambda} nm` : '백색광';
    S.objs.filter(o => o.type === 'slit').forEach(o => { o.params.gap = L.gap; });
  }

  /* ---------- 추적·판정 ---------- */
  function retrace() {
    // 광학(타기 전/후) + 역학을 한 번에 푼다. 센서는 최종 상태의 광선(R)으로 판정한다
    const sol = MECH.solve(S.objs);
    R = sol.R; M = sol.M; rays = sol.rays; paperRes = sol.paperRes; hasBurn = sol.burnt;
    replayT0 = performance.now();
    evaluate();
    dirty = true;
    updateReadout();
    updateSelPanel();
    maybeWin();
  }

  function evaluate() {
    evalRes = [];
    for (const o of S.objs) {
      if (o.type === 'sensor') {
        const hits = R.sensorHits.get(o) || [];
        const res = { obj: o, hits, total: hits.reduce((a, h) => a + h.I, 0) };
        if (o.goal) { const g = GAME.evalGoal(o.goal, hits, R.emitted); res.checks = g.checks; res.ok = g.ok; }
        evalRes.push(res);
      } else if (o.type === 'paper' && !o.hidden) {
        const pr = paperRes.find(r => r.obj === o);
        evalRes.push({ obj: o, hits: pr.hits, checks: pr.checks, ok: pr.ok, reflected: pr.reflected });
      } else if (o.type === 'loadcell' && o.goal && !o.hidden) {
        const cell = M && M.cells.find(k => k.obj === o);
        const g = GAME.evalCell(o.goal, cell ? cell.hit : null);
        evalRes.push({ obj: o, hits: [], checks: g.checks, ok: g.ok, hit: cell ? cell.hit : null });
      } else if (o.type === 'pendulum' && o.goal && !o.hidden) {
        const q = M && M.pends.find(k => k.obj === o);
        const g = GAME.evalPend(o.goal, q);
        evalRes.push({ obj: o, hits: [], checks: g.checks, ok: g.ok, struck: q ? q.struck : null });
      }
    }
  }

  // 재생 시간(s) → 시뮬레이션 시간
  const replayTime = () => (performance.now() - replayT0) / 1000;
  const simTime = replayTime;
  const replayDone = () => !M || simTime() >= M.tEnd;
  // 재생 중 보여줄 광선: 종이가 타기 전에는 구슬이 빛을 막고 있던 상태, 연쇄로 타면 단계별로 바뀐다
  function raysNow() {
    if (!M || !hasBurn) return R;
    const t = replayTime();
    let out = R;
    for (const k of rays) if (k.t <= t) out = k.R; else break;
    return out;
  }
  // 마지막 로드셀 접촉이 화면에 보이는 재생 시각(ms)
  function lastEventMs() {
    if (!M) return 0;
    const ts = M.cells.filter(k => k.hit).map(k => k.hit.t);
    return ts.length ? Math.max(...ts) * 1000 : 0;
  }

  function allGoalsMet() {
    const g = evalRes.filter(r => r.obj.goal);
    return g.length > 0 && g.every(r => r.ok);
  }

  function maybeWin() {
    if (S.mode !== 'stage' || S.won || S.revealed) return;
    clearTimeout(winTimer);
    if (!allGoalsMet() || drag) return;
    winTimer = setTimeout(() => {
      if (!drag && allGoalsMet() && !S.won && !S.revealed) {
        S.won = true; S.overlay = true;
        cleared.add(STAGES[S.stage].id); saveCleared(); updateNav();
        showClear(); dirty = true;
      }
    }, Math.max(450, lastEventMs() + 700));
  }

  /* ---------- 캔버스 ---------- */
  const cv = $('#board');
  const ctx = cv.getContext('2d');
  let scale = 1, dpr = 1, cssW = 0, cssH = 0, bench = null;

  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    cssW = r.width; cssH = r.width * H / W;
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    scale = cssW / W;
    buildBench();
    dirty = true;
  }

  function buildBench() {
    bench = document.createElement('canvas');
    bench.width = cv.width; bench.height = cv.height;
    const b = bench.getContext('2d');
    const k = dpr * scale, px = 1 / scale;
    b.setTransform(k, 0, 0, k, 0, 0);
    b.fillStyle = C.bench; b.fillRect(0, 0, W, H);
    // 양극산화 표면의 미세한 결
    const g = b.createRadialGradient(W * 0.45, H * 0.4, 50, W * 0.5, H * 0.5, W * 0.75);
    g.addColorStop(0, 'rgba(120,140,170,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    // M6 나사 구멍 (25 mm 간격)
    const hr = Math.max(2.2, 1.6 * px);
    for (let x = 25; x < W; x += 25) for (let y = 25; y < H; y += 25) {
      b.beginPath(); b.arc(x, y, hr, 0, Math.PI * 2); b.fillStyle = C.hole; b.fill();
      b.beginPath(); b.arc(x, y, hr, 0.15 * Math.PI, 0.85 * Math.PI); b.strokeStyle = C.holeRim; b.lineWidth = 0.9 * px; b.stroke();
    }
    // 눈금 (mm)
    b.fillStyle = C.ruler; b.strokeStyle = C.ruler; b.lineWidth = px;
    b.font = `${9 * px}px "IBM Plex Mono", ui-monospace, monospace`;
    b.textBaseline = 'top';
    for (let x = 0; x <= W; x += 25) {
      const big = x % 100 === 0;
      b.beginPath(); b.moveTo(x, 0); b.lineTo(x, (big ? 7 : 3.5) * px); b.stroke();
      if (big && x > 0 && x < W) b.fillText(String(x), x + 2.5 * px, 2 * px);
    }
    b.textBaseline = 'middle';
    for (let y = 0; y <= H; y += 25) {
      const big = y % 100 === 0;
      b.beginPath(); b.moveTo(0, y); b.lineTo((big ? 7 : 3.5) * px, y); b.stroke();
      if (big && y > 0 && y < H) b.fillText(String(y), 9 * px, y);
    }
    b.fillText('mm', 9 * px, 12 * px);
  }

  function render() {
    if (!bench) return;
    const k = dpr * scale, px = 1 / scale;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(bench, 0, 0);
    ctx.setTransform(k, 0, 0, k, 0, 0);

    for (const o of S.objs) if (o.type === 'wall' && !o.hidden) drawWall(ctx, o, px);
    drawRays(ctx, px);
    for (const o of S.objs) {
      if (o.hidden || o.type === 'wall' || BODY_TYPES.has(o.type)) continue;
      drawObj(ctx, o, px);
      if (o.locked && !NO_PIN.has(o.type)) drawPin(ctx, o, px);
    }
    for (const o of S.objs) if (o.label && !o.hidden) drawLabel(ctx, o, px);
    drawBodies(ctx, px);
    const sel = selObj();
    if (sel && !sel.hidden) drawSelection(ctx, sel, px);
    if (blocked) {
      const o = S.objs.find(k => k.id === blocked.id);
      if (performance.now() < blocked.until && o && !o.hidden) { drawBlocked(ctx, o, px); dirty = true; }
      else blocked = null;
    }
  }

  function loop() {
    if (M && !replayDone()) dirty = true;
    else if (hasBurn && replayTime() < BURN_T + 0.3) dirty = true;
    if (dirty) { dirty = false; render(); }
    requestAnimationFrame(loop);
  }

  /* ---------- 광선 그리기 ---------- */
  const colorCache = new Map();
  const colOf = l => { if (!colorCache.has(l)) colorCache.set(l, wlRGB(l)); return colorCache.get(l); };

  // 이웃한 두 광선 사이를 면으로 채워 연속된 빛 띠처럼 보이게 한다
  function fillSheet(c, A, B, alpha, pastel) {
    const n = Math.min(A.tags.length, B.tags.length);
    let m = 0;
    while (m + 1 < n && A.tags[m + 1] === B.tags[m + 1]) m++;
    const ca = colOf(A.lambda), cb = colOf(B.lambda);
    let r = (ca[0] + cb[0]) / 2, g = (ca[1] + cb[1]) / 2, b = (ca[2] + cb[2]) / 2;
    // 여러 파장이 겹치는 면은 흰빛에 가깝게 섞는다
    if (pastel) { r = r * 0.45 + 140; g = g * 0.45 + 140; b = b * 0.45 + 140; }
    c.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${alpha})`;
    c.beginPath();
    for (let s = 0; s < m; s++) {
      const a = 2 * s;
      c.moveTo(A.pts[a], A.pts[a + 1]); c.lineTo(A.pts[a + 2], A.pts[a + 3]);
      c.lineTo(B.pts[a + 2], B.pts[a + 3]); c.lineTo(B.pts[a], B.pts[a + 1]); c.closePath();
    }
    // 갈라지는 구간: 둘 중 먼저 끝나는 거리까지만 채운다
    const a = 2 * m;
    if (a + 3 < A.pts.length && a + 3 < B.pts.length) {
      const ax = A.pts[a], ay = A.pts[a + 1], bx = B.pts[a], by = B.pts[a + 1];
      const adx = A.pts[a + 2] - ax, ady = A.pts[a + 3] - ay, bdx = B.pts[a + 2] - bx, bdy = B.pts[a + 3] - by;
      const la = Math.hypot(adx, ady), lb = Math.hypot(bdx, bdy), L = Math.min(la, lb);
      if (la > 1e-6 && lb > 1e-6 && Math.hypot(ax - bx, ay - by) < 40) {
        c.moveTo(ax, ay); c.lineTo(ax + adx * L / la, ay + ady * L / la);
        c.lineTo(bx + bdx * L / lb, by + bdy * L / lb); c.lineTo(bx, by); c.closePath();
      }
    }
    c.fill('nonzero');
  }

  function drawSheets(c, paths) {
    const grid = new Map();
    for (const p of paths) grid.set(`${p.si}:${p.oi}:${p.bi}:${p.li}`, p);
    for (const p of paths) {
      const nb = grid.get(`${p.si}:${p.oi}:${p.bi}:${p.li + 1}`);
      if (nb) fillSheet(c, p, nb, 0.34 / Math.sqrt(p.nO));
      const nb2 = grid.get(`${p.si}:${p.oi + 1}:${p.bi}:${p.li}`);
      if (nb2) fillSheet(c, p, nb2, p.nL > 2 ? 0.72 / p.nL : 0.4, p.nL > 2);
    }
  }

  function drawRays(c, px) {
    const paths = raysNow().paths;
    c.save();
    c.globalCompositeOperation = 'lighter';
    drawSheets(c, paths);
    c.lineJoin = 'round'; c.lineCap = 'round';
    const passes = [
      { w: 12, a: 0.014 },
      { w: 4.2, a: 0.05 },
      { w: 1.3, a: 0.5 },
    ];
    for (const pass of passes) {
      c.lineWidth = pass.w * px;
      for (const p of paths) {
        let boost = p.nL <= 2 && pass.w > 2 ? 9 : 1;
        if (p.nO > 1 && p.nL > 2) boost *= pass.w > 2 ? 0.5 : 0.3;
        c.strokeStyle = rgba(colOf(p.lambda), Math.min(1, pass.a * boost * p.I));
        c.beginPath();
        c.moveTo(p.pts[0], p.pts[1]);
        for (let i = 2; i < p.pts.length; i += 2) c.lineTo(p.pts[i], p.pts[i + 1]);
        c.stroke();
      }
    }
    drawGlassFringe(c, px, paths);
    // 빛이 닿은 자리
    for (const p of paths) {
      const n = p.pts.length, x = p.pts[n - 2], y = p.pts[n - 1];
      const mono = p.nL <= 2;
      const r = (mono ? 11 : 8) * px;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      const col = colOf(p.lambda);
      g.addColorStop(0, rgba(col, mono ? 0.7 : Math.min(0.25, 9 / p.nL / p.nO))); g.addColorStop(1, rgba(col, 0));
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  // 유리를 지나는 구간에도 파장별 색을 얹어, 굴절되는 순간부터 분산이 드러나게 한다.
  // 더하기 블렌딩(lighter)은 서로 다른 파장이 겹치면 다시 백색으로 합쳐지므로,
  // 이 구간만은 보통 블렌딩(source-over)으로 얇게 덧칠해 가장자리 색 번짐을 보여준다.
  function drawGlassFringe(c, px, paths) {
    const groups = new Map();
    for (const p of paths) {
      if (p.nL <= 2) continue; // 단색광은 분산이 없다
      const key = `${p.si}:${p.oi}:${p.bi}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    if (!groups.size) return;
    c.save();
    c.globalCompositeOperation = 'source-over';
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.lineWidth = Math.max(1.6, 2.4 * px);
    for (const group of groups.values()) {
      group.sort((x, y) => x.li - y.li);
      for (const p of group) {
        for (let i = 1; i < p.tags.length - 1; i++) {
          const t0 = p.tags[i], t1 = p.tags[i + 1];
          if (t0 && t1 && typeof t0 === 'object' && typeof t1 === 'object' && t0.role === 'glass' && t1.role === 'glass') {
            const a = 2 * i;
            c.strokeStyle = rgba(colOf(p.lambda), 0.14);
            c.beginPath();
            c.moveTo(p.pts[a], p.pts[a + 1]);
            c.lineTo(p.pts[a + 2], p.pts[a + 3]);
            c.stroke();
          }
        }
      }
    }
    c.restore();
  }

  /* ---------- 부품 그리기 ---------- */
  function partGeom(o) {
    const def = PARTS[o.type];
    const params = Object.assign({}, def.defaults, o.params || {});
    return { params, g: def.build(params) };
  }

  function withLocal(c, o, fn) {
    c.save(); c.translate(o.x, o.y); c.rotate(o.rot * Math.PI / 180); fn(); c.restore();
  }

  function glassStyle(c, px, y0, y1) {
    const g = c.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, 'rgba(205,230,255,0.17)');
    g.addColorStop(1, 'rgba(150,190,235,0.06)');
    c.fillStyle = g; c.fill();
    c.strokeStyle = C.glassEdge; c.lineWidth = 1.3 * px; c.stroke();
  }

  function drawObj(c, o, px) {
    const { params: p, g } = partGeom(o);
    withLocal(c, o, () => {
      switch (o.type) {
        case 'prism': {
          const s = p.side, a = s / Math.sqrt(3);
          c.beginPath(); c.moveTo(0, -a); c.lineTo(s / 2, a / 2); c.lineTo(-s / 2, a / 2); c.closePath();
          glassStyle(c, px, -a, a / 2);
          const q = 0.82;
          c.beginPath(); c.moveTo(0, -a * q); c.lineTo(s / 2 * q, a / 2 * q); c.lineTo(-s / 2 * q, a / 2 * q); c.closePath();
          c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = px; c.stroke();
          break;
        }
        case 'lensConvex': {
          const { R: Rr, t, e } = g.geo, ph = Math.asin(p.h / Rr);
          c.beginPath();
          c.moveTo(-e / 2, -p.h); c.lineTo(e / 2, -p.h);
          c.arc(t / 2 - Rr, 0, Rr, -ph, ph, false);
          c.lineTo(-e / 2, p.h);
          c.arc(Rr - t / 2, 0, Rr, Math.PI - ph, Math.PI + ph, false);
          c.closePath();
          glassStyle(c, px, -p.h, p.h);
          axisTicks(c, p.h, px);
          break;
        }
        case 'lensConcave': {
          const { R: Rr, sag, c0 } = g.geo, ph = Math.asin(p.h / Rr), ex = c0 / 2 + sag;
          c.beginPath();
          c.moveTo(-ex, -p.h); c.lineTo(ex, -p.h);
          c.arc(c0 / 2 + Rr, 0, Rr, Math.PI + ph, Math.PI - ph, true);
          c.lineTo(-ex, p.h);
          c.arc(-c0 / 2 - Rr, 0, Rr, ph, -ph, true);
          c.closePath();
          glassStyle(c, px, -p.h, p.h);
          axisTicks(c, p.h, px);
          break;
        }
        case 'mirror': {
          c.beginPath(); c.rect(0, -p.h, 7, 2 * p.h);
          mirrorBack(c, px, () => { c.beginPath(); c.rect(0, -p.h, 7, 2 * p.h); });
          c.beginPath(); c.moveTo(0, -p.h); c.lineTo(0, p.h);
          mirrorFront(c, px);
          break;
        }
        case 'mirrorConcave': {
          const { R: Rr, phi } = g.geo;
          const shape = () => { c.beginPath(); c.arc(-Rr, 0, Rr, -phi, phi, false); c.arc(-Rr, 0, Rr + 7, phi * Rr / (Rr + 7), -phi * Rr / (Rr + 7), true); c.closePath(); };
          mirrorBack(c, px, shape);
          c.beginPath(); c.arc(-Rr, 0, Rr, -phi, phi, false);
          mirrorFront(c, px);
          break;
        }
        case 'mirrorConvex': {
          const { R: Rr, phi } = g.geo;
          const p2 = Math.asin(p.h / (Rr - 7));
          const shape = () => { c.beginPath(); c.arc(Rr, 0, Rr, Math.PI - phi, Math.PI + phi, false); c.arc(Rr, 0, Rr - 7, Math.PI + p2, Math.PI - p2, true); c.closePath(); };
          mirrorBack(c, px, shape);
          c.beginPath(); c.arc(Rr, 0, Rr, Math.PI - phi, Math.PI + phi, false);
          mirrorFront(c, px);
          break;
        }
        case 'slit': {
          const hl = p.len / 2, hg = p.gap / 2, ht = p.th / 2 + 1;
          for (const [y0, y1] of [[-hl, -hg], [hg, hl]]) {
            c.beginPath(); c.rect(-ht, y0, 2 * ht, y1 - y0);
            c.fillStyle = '#2b313a'; c.fill();
            c.strokeStyle = '#59636f'; c.lineWidth = px; c.stroke();
          }
          c.strokeStyle = 'rgba(230,236,244,0.75)'; c.lineWidth = 1.2 * px;
          c.beginPath(); c.moveTo(-ht, -hg); c.lineTo(ht, -hg); c.moveTo(-ht, hg); c.lineTo(ht, hg); c.stroke();
          c.fillStyle = '#7b8594';
          for (const y of [-hl + 8, hl - 8]) { c.beginPath(); c.arc(0, y, 1.8, 0, Math.PI * 2); c.fill(); }
          break;
        }
        case 'prismRight': {
          const h = p.side / 2;
          c.beginPath(); c.moveTo(-h, -h); c.lineTo(h, h); c.lineTo(-h, h); c.closePath();
          glassStyle(c, px, -h, h);
          c.beginPath(); c.moveTo(-h * 0.8, -h * 0.55); c.lineTo(h * 0.72, h * 0.72); c.lineTo(-h * 0.8, h * 0.72); c.closePath();
          c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = px; c.stroke();
          break;
        }
        case 'splitter': {
          c.beginPath(); c.rect(-2, -p.h, 4, 2 * p.h);
          const grad = c.createLinearGradient(-2, 0, 2, 0);
          grad.addColorStop(0, 'rgba(180,220,255,0.10)'); grad.addColorStop(0.5, 'rgba(220,240,255,0.38)'); grad.addColorStop(1, 'rgba(180,220,255,0.10)');
          c.fillStyle = grad; c.fill();
          c.strokeStyle = 'rgba(210,230,255,0.6)'; c.lineWidth = px; c.stroke();
          c.save();
          c.beginPath(); c.rect(-2, -p.h, 4, 2 * p.h); c.clip();
          c.strokeStyle = 'rgba(230,240,255,0.22)'; c.lineWidth = px;
          c.beginPath();
          for (let y = -p.h - 8; y < p.h + 8; y += 7) { c.moveTo(-6, y); c.lineTo(6, y + 10); }
          c.stroke();
          c.restore();
          break;
        }
        case 'filter': {
          const ht = p.th / 2;
          const col = wlRGB((p.min + p.max) / 2);
          c.beginPath(); c.rect(-ht, -p.h, 2 * ht, 2 * p.h);
          if (p.excl) {
            c.fillStyle = 'rgba(40,44,52,0.55)'; c.fill();
            c.save(); c.beginPath(); c.rect(-ht, -p.h, 2 * ht, 2 * p.h); c.clip();
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.9)`; c.lineWidth = 1.6 * px;
            c.beginPath();
            for (let y = -p.h - 2 * ht; y < p.h + 2 * ht; y += 5) { c.moveTo(-ht, y); c.lineTo(ht, y + 2 * ht); }
            c.stroke(); c.restore();
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.9)`; c.lineWidth = px; c.stroke();
          } else {
            c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.4)`; c.fill();
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.9)`; c.lineWidth = px; c.stroke();
          }
          break;
        }
        case 'source': drawSource(c, o, p, px); break;
        case 'sensor': drawSensor(c, o, p, px); break;
        case 'plank': drawPlank(c, p, px); break;
        case 'paper': drawPaper(c, o, p, px); break;
        case 'loadcell': drawLoadcell(c, o, p, px); break;
        case 'slide': drawSlide(c, p, px); break;
      }
    });
  }

  // 슬라이드: 원호 띄. 구슬은 안쪽 면을 탄다
  function drawSlide(c, p, px) {
    const d = Math.PI / 180, a0 = Math.min(p.a0, p.a1) * d, a1 = Math.max(p.a0, p.a1) * d;
    const band = () => { c.beginPath(); c.arc(0, 0, p.R, a0, a1, false); c.arc(0, 0, p.R + p.w, a1, a0, true); c.closePath(); };
    band();
    const g = c.createRadialGradient(0, 0, p.R, 0, 0, p.R + p.w);
    g.addColorStop(0, '#5b6572'); g.addColorStop(0.35, '#3a424d'); g.addColorStop(1, '#232930');
    c.fillStyle = g; c.fill();
    c.save(); band(); c.clip();
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 2 * px;
    c.beginPath();
    for (let a = a0; a <= a1; a += 4 * d) { c.moveTo(Math.cos(a) * (p.R + 1), Math.sin(a) * (p.R + 1)); c.lineTo(Math.cos(a) * (p.R + p.w), Math.sin(a) * (p.R + p.w)); }
    c.stroke(); c.restore();
    band(); c.strokeStyle = '#6b7684'; c.lineWidth = px; c.stroke();
    // 활주면 하이라이트
    c.beginPath(); c.arc(0, 0, p.R + 1.2, a0, a1, false); c.strokeStyle = 'rgba(220,235,255,0.35)'; c.lineWidth = 1.6 * px; c.stroke();
  }

  // 지레: 받침대(고정) + 기울어지는 막대
  function drawLever(c, o, p, a, px) {
    c.save(); c.translate(o.x, o.y);
    // 받침대
    c.beginPath(); c.moveTo(0, 2); c.lineTo(-14, 26); c.lineTo(14, 26); c.closePath();
    const fg = c.createLinearGradient(0, 2, 0, 26); fg.addColorStop(0, '#4b5563'); fg.addColorStop(1, '#262c35');
    c.fillStyle = fg; c.fill(); c.strokeStyle = C.bodyEdge; c.lineWidth = px; c.stroke();
    roundRect(c, -20, 24, 40, 6, 2); c.fillStyle = '#20262e'; c.fill(); c.stroke();
    // 막대
    c.rotate(a);
    const ht = p.th / 2, L = p.l1 + p.l2;
    roundRect(c, -p.l1, -ht, L, p.th, 2);
    const g = c.createLinearGradient(0, -ht, 0, ht);
    g.addColorStop(0, '#a9793f'); g.addColorStop(0.5, '#8a6132'); g.addColorStop(1, '#6b4a25');
    c.fillStyle = g; c.fill();
    c.save(); roundRect(c, -p.l1, -ht, L, p.th, 2); c.clip();
    c.strokeStyle = 'rgba(60,35,10,0.45)'; c.lineWidth = px;
    c.beginPath();
    for (let i = -3; i <= 3; i++) { const y = i * ht / 3.2; c.moveTo(-p.l1, y); c.bezierCurveTo(-p.l1 / 3, y + 1.5, p.l2 / 3, y - 1.5, p.l2, y); }
    c.stroke(); c.restore();
    roundRect(c, -p.l1, -ht, L, p.th, 2); c.strokeStyle = '#3d2a14'; c.lineWidth = px; c.stroke();
    // 축 핀
    c.beginPath(); c.arc(0, 0, 3.2, 0, Math.PI * 2); c.fillStyle = '#9aa5b4'; c.fill(); c.strokeStyle = '#151a20'; c.lineWidth = px; c.stroke();
    c.restore();
  }

  /* ---------- 역학 부품 그리기 ---------- */
  function drawPlank(c, p, px) {
    const hl = p.len / 2, ht = p.th / 2;
    roundRect(c, -hl, -ht, p.len, p.th, 2);
    const g = c.createLinearGradient(0, -ht, 0, ht);
    g.addColorStop(0, '#a9793f'); g.addColorStop(0.5, '#8a6132'); g.addColorStop(1, '#6b4a25');
    c.fillStyle = g; c.fill();
    c.save(); roundRect(c, -hl, -ht, p.len, p.th, 2); c.clip();
    c.strokeStyle = 'rgba(60,35,10,0.45)'; c.lineWidth = px;
    c.beginPath();
    for (let i = -3; i <= 3; i++) { const y = i * ht / 3.2; c.moveTo(-hl, y); c.bezierCurveTo(-hl / 3, y + 1.5, hl / 3, y - 1.5, hl, y); }
    c.stroke(); c.restore();
    roundRect(c, -hl, -ht, p.len, p.th, 2); c.strokeStyle = '#3d2a14'; c.lineWidth = px; c.stroke();
    // 끝의 고정 나사
    c.fillStyle = '#3a3f47';
    for (const x of [-hl + 7, hl - 7]) { c.beginPath(); c.arc(x, 0, 2.2, 0, Math.PI * 2); c.fill(); }
  }

  function drawPaper(c, o, p, px) {
    const hw = p.w / 2, ht = p.th / 2;
    const rb = p.reflect;
    const tint = rb ? colOf((rb[0] + rb[1]) / 2) : null;
    const paperFill = tint ? `rgba(${Math.round(120 + tint[0] * 0.5)},${Math.round(120 + tint[1] * 0.5)},${Math.round(120 + tint[2] * 0.5)},0.95)` : '#d9d2c0';
    if (!o.burnt) {
      c.beginPath(); c.rect(-hw, -ht, p.w, p.th); c.fillStyle = paperFill; c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = px; c.stroke();
      // 뜨거워지는 자리: 집광 세기에 따라 갈색으로
      const res = evalRes.find(r => r.obj === o);
      if (res && res.hits.length) {
        const v = res.checks[0].frac / p.need;
        const us = res.hits.map(h => h.u), um = us.reduce((a, b) => a + b, 0) / us.length;
        const x = -hw + um * p.w, rad = 6 + 10 * Math.min(1, v);
        const g = c.createRadialGradient(x, 0, 0, x, 0, rad);
        g.addColorStop(0, `rgba(90,50,20,${0.15 + 0.6 * Math.min(1, v)})`); g.addColorStop(1, 'rgba(90,50,20,0)');
        c.fillStyle = g; c.fillRect(x - rad, -ht, 2 * rad, p.th);
      }
      return;
    }
    // 타버린 종이: 양 끝의 그을은 조각만 남고, 처음 잠깐은 불씨가 보인다
    const k = Math.min(1, replayTime() / BURN_T);
    const gone = hw * (0.25 + 0.6 * k);
    for (const sgn of [-1, 1]) {
      c.beginPath();
      c.moveTo(sgn * hw, -ht); c.lineTo(sgn * gone, -ht - 1.5 * k); c.lineTo(sgn * (gone + 4), ht + 1); c.lineTo(sgn * hw, ht); c.closePath();
      c.fillStyle = paperFill; c.fill();
      c.strokeStyle = `rgba(20,10,5,${0.5 + 0.4 * k})`; c.lineWidth = 1.4 * px; c.stroke();
    }
    if (k < 1) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(0, 0, 0, 0, 0, 18 + 14 * k);
      g.addColorStop(0, `rgba(255,170,60,${0.7 * (1 - k)})`); g.addColorStop(1, 'rgba(255,120,30,0)');
      c.fillStyle = g; c.fillRect(-40, -22, 80, 44);
      c.restore();
    }
  }

  function drawLoadcell(c, o, p, px) {
    const hw = p.w / 2, hh = p.h / 2;
    // 받침
    roundRect(c, -hw - 6, hh - 2, p.w + 12, 8, 2); c.fillStyle = '#20262e'; c.fill(); c.strokeStyle = C.bodyEdge; c.lineWidth = px; c.stroke();
    // 감지판
    roundRect(c, -hw, -hh, p.w, p.h, 2);
    const g = c.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, '#4b5563'); g.addColorStop(1, '#2b323c');
    c.fillStyle = g; c.fill(); c.strokeStyle = '#6b7684'; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.08)';
    c.beginPath(); for (let x = -hw + 8; x < hw; x += 8) { c.moveTo(x, -hh + 2); c.lineTo(x, hh - 2); } c.stroke();
    // 접촉 LED
    const res = evalRes.find(r => r.obj === o);
    const lit = res && res.hit && simTime() >= res.hit.t;
    const ok = lit && res.ok;
    c.beginPath(); c.arc(hw + 1, hh + 2, 3, 0, Math.PI * 2);
    c.fillStyle = !lit ? '#3a2622' : ok ? C.ok : C.bad; c.fill();
    if (lit) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const col = ok ? '116,217,159' : '255,138,122';
      const gr = c.createRadialGradient(hw + 1, hh + 2, 0, hw + 1, hh + 2, 14);
      gr.addColorStop(0, `rgba(${col},0.6)`); gr.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = gr; c.beginPath(); c.arc(hw + 1, hh + 2, 14, 0, Math.PI * 2); c.fill(); c.restore();
    }
  }

  // heavy: 질량이 큰 구슬(납)은 어둡고 무디게 그린다
  function drawBall(c, x, y, r, px, heavy) {
    c.beginPath(); c.arc(x + 1.5, y + 2, r, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,0.35)'; c.fill();
    const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    if (heavy) { g.addColorStop(0, '#b9bfc8'); g.addColorStop(0.45, '#5f6873'); g.addColorStop(1, '#1b1f25'); }
    else { g.addColorStop(0, '#f4f7fb'); g.addColorStop(0.45, '#aeb8c6'); g.addColorStop(1, '#3d4654'); }
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = px; c.stroke();
  }

  function drawBodies(c, px) {
    const bodies = S.objs.filter(o => BODY_TYPES.has(o.type) && !o.hidden);
    if (!bodies.length) return;
    const f = M ? MECH.frameAt(M, simTime()) : null;
    for (const o of bodies) {
      const p = partGeom(o).params;
      if (o.type === 'pendulum') {
        const i = M ? M.pends.findIndex(q => q.obj === o) : -1;
        const a = f && i >= 0 ? f.p[i] : p.a0 * Math.PI / 180;
        const bx = o.x + p.L * Math.sin(a), by = o.y + p.L * Math.cos(a);
        // 축 브래킷
        roundRect(c, o.x - 12, o.y - 8, 24, 12, 2); c.fillStyle = '#2b323c'; c.fill(); c.strokeStyle = C.bodyEdge; c.lineWidth = px; c.stroke();
        c.beginPath(); c.arc(o.x, o.y, 2.5, 0, Math.PI * 2); c.fillStyle = '#9aa5b4'; c.fill();
        // 줄
        c.beginPath(); c.moveTo(o.x, o.y); c.lineTo(bx, by); c.strokeStyle = 'rgba(220,225,235,0.75)'; c.lineWidth = 1.2 * px; c.stroke();
        drawBall(c, bx, by, p.r, px, p.m > 1);
      } else if (o.type === 'lever') {
        const i = M ? M.levers.findIndex(q => q.obj === o) : -1;
        const a = f && i >= 0 ? f.l[i] : o.rot * Math.PI / 180;
        drawLever(c, o, p, a, px);
      } else {
        const i = M ? M.balls.findIndex(b => b.obj === o) : -1;
        const st = f && i >= 0 ? f.b[i] : [o.x, o.y, 0];
        if (st[2]) continue;
        drawBall(c, st[0], st[1], p.r, px, p.m > 1);
      }
    }
  }

  // 정반에 볼트로 고정된 부품 표시
  function drawPin(c, o, px) {
    c.save();
    c.beginPath(); c.arc(o.x, o.y, 5.5, 0, Math.PI * 2); c.fillStyle = '#3a424d'; c.fill();
    c.strokeStyle = '#7b8594'; c.lineWidth = px; c.stroke();
    c.beginPath(); c.moveTo(o.x - 3, o.y); c.lineTo(o.x + 3, o.y); c.moveTo(o.x, o.y - 3); c.lineTo(o.x, o.y + 3);
    c.strokeStyle = '#151a20'; c.lineWidth = 1.4 * px; c.stroke();
    c.restore();
  }

  function axisTicks(c, h, px) {
    c.strokeStyle = 'rgba(205,232,255,0.35)'; c.lineWidth = px;
    c.beginPath(); c.moveTo(0, -h - 6); c.lineTo(0, -h - 2); c.moveTo(0, h + 2); c.lineTo(0, h + 6); c.stroke();
  }

  function mirrorBack(c, px, shape) {
    shape(); c.fillStyle = '#20262e'; c.fill();
    c.save(); shape(); c.clip();
    c.strokeStyle = 'rgba(160,172,188,0.35)'; c.lineWidth = px;
    c.beginPath();
    for (let y = -70; y < 70; y += 6) { c.moveTo(-10, y); c.lineTo(14, y + 24); }
    c.stroke(); c.restore();
    shape(); c.strokeStyle = '#4b5562'; c.lineWidth = px; c.stroke();
  }

  function mirrorFront(c, px) {
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(220,235,255,0.25)'; c.lineWidth = 5 * px; c.stroke();
    c.strokeStyle = C.silver; c.lineWidth = 2.2 * px; c.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawSource(c, o, p, px) {
    roundRect(c, -50, -17, 50, 34, 4);
    const g = c.createLinearGradient(0, -17, 0, 17);
    g.addColorStop(0, '#343b45'); g.addColorStop(1, '#22272f');
    c.fillStyle = g; c.fill(); c.strokeStyle = C.bodyEdge; c.lineWidth = px; c.stroke();
    // 방열 홈
    c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.4 * px;
    c.beginPath(); for (let x = -42; x <= -22; x += 5) { c.moveTo(x, -11); c.lineTo(x, 11); } c.stroke();
    // 출사구
    const col = p.spectrum === 'mono' ? colOf(p.lambda) : [255, 250, 240];
    const hw = Math.max(4, (p.width || 0) / 2 + 3);
    c.fillStyle = '#0b0d10'; c.fillRect(-6, -Math.min(15, hw + 2), 6, 2 * Math.min(15, hw + 2));
    c.save(); c.globalCompositeOperation = 'lighter';
    const gl = c.createRadialGradient(0, 0, 0, 0, 0, 18);
    gl.addColorStop(0, rgba(col, 0.55)); gl.addColorStop(1, rgba(col, 0));
    c.fillStyle = gl; c.beginPath(); c.arc(0, 0, 18, 0, Math.PI * 2); c.fill();
    c.restore();
    c.fillStyle = rgba(col, 0.95); c.fillRect(-2.5, -Math.min(13, hw), 2.5, 2 * Math.min(13, hw));
  }

  function drawSensor(c, o, p, px) {
    const hl = p.len / 2;
    roundRect(c, 0, -hl - 4, 22, 2 * hl + 8, 3);
    const g = c.createLinearGradient(0, 0, 22, 0);
    g.addColorStop(0, '#2f3640'); g.addColorStop(1, '#20252c');
    c.fillStyle = g; c.fill(); c.strokeStyle = C.bodyEdge; c.lineWidth = px; c.stroke();
    // 수광면 — 재생 시점의 광선(종이가 타기 전에는 구슬이 막고 있던 상태)으로 그린다
    const hitsNow = raysNow().sensorHits.get(o) || [];
    const res = hitsNow.length ? { hits: hitsNow } : null;
    c.fillStyle = '#0a0d10'; c.fillRect(-3, -hl, 5, 2 * hl);
    if (res && res.hits.length) {
      c.save(); c.globalCompositeOperation = 'lighter';
      for (const h of res.hits) {
        const y = -hl + h.u * 2 * hl, col = colOf(h.lambda);
        const gr = c.createRadialGradient(-1, y, 0, -1, y, 9);
        gr.addColorStop(0, rgba(col, 0.6)); gr.addColorStop(1, rgba(col, 0));
        c.fillStyle = gr; c.fillRect(-10, y - 9, 20, 18);
      }
      c.restore();
    }
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = px;
    c.beginPath(); for (let y = -hl + 10; y < hl; y += 10) { c.moveTo(-3, y); c.lineTo(2, y); } c.stroke();
    // 상태 LED
    if (o.goal) {
      const on = res && res.ok;
      c.beginPath(); c.arc(13, -hl + 6, 3, 0, Math.PI * 2);
      c.fillStyle = on ? C.ok : '#3a2622'; c.fill();
      if (on) {
        c.save(); c.globalCompositeOperation = 'lighter';
        const gr = c.createRadialGradient(13, -hl + 6, 0, 13, -hl + 6, 12);
        gr.addColorStop(0, 'rgba(116,217,159,0.6)'); gr.addColorStop(1, 'rgba(116,217,159,0)');
        c.fillStyle = gr; c.beginPath(); c.arc(13, -hl + 6, 12, 0, Math.PI * 2); c.fill(); c.restore();
      }
    }
  }

  function drawWall(c, o, px) {
    const { params: p } = partGeom(o);
    withLocal(c, o, () => {
      const x0 = -p.w / 2, y0 = -p.h / 2;
      c.beginPath(); c.rect(x0, y0, p.w, p.h); c.fillStyle = C.wall; c.fill();
      c.save(); c.beginPath(); c.rect(x0, y0, p.w, p.h); c.clip();
      c.strokeStyle = 'rgba(255,255,255,0.045)'; c.lineWidth = 3 * px;
      c.beginPath(); for (let x = x0 - p.h - 40; x < x0 + p.w + 40; x += 12) { c.moveTo(x, y0 + p.h + 2); c.lineTo(x + p.h + 4, y0 - 2); } c.stroke();
      c.restore();
      c.beginPath(); c.rect(x0, y0, p.w, p.h); c.strokeStyle = C.wallEdge; c.lineWidth = px; c.stroke();
    });
  }

  function tapePath(c, x, y, w, h) {
    const z = 3;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + w, y);
    for (let i = 1; i <= 4; i++) c.lineTo(x + w + (i % 2 ? -z : 0), y + h * i / 4);
    c.lineTo(x, y + h);
    for (let i = 3; i >= 0; i--) c.lineTo(x + (i % 2 ? z : 0), y + h * i / 4);
    c.closePath();
  }

  function drawLabel(c, o, px) {
    const ls = clamp(scale / 0.95, 0.72, 1);
    const fs = 17 * ls * px;
    c.save();
    c.font = `${fs}px "Nanum Pen Script", "Gaegu", cursive`;
    const tw = c.measureText(o.label).width;
    const w = tw + 16 * ls * px, h = 21 * ls * px;
    // 빛이 드나드는 쪽은 피해서 위 → 아래 → 오른쪽 → 왼쪽 순으로 자리를 찾는다
    // 진자 라벨은 축 브래킷 옆에 붙인다 (전체 흔들림 범위 상자는 너무 크다)
    const bb = o.type === 'pendulum' ? [o.x - 12, o.y - 8, o.x + 12, o.y + 4] : worldBox(o), gap = 7 * px, th = o.rot * Math.PI / 180;
    // 빛이 드나드는 쪽(fx, fy)은 광학 부품에만 있다. 역학 부품은 어느 쪽이든 상관없다
    const mech = o.type === 'paper' || o.type === 'loadcell' || o.type === 'pendulum' || o.type === 'ball' || o.type === 'wall' || o.type === 'lever' || o.type === 'slide';
    const fx = mech ? 0 : o.type === 'sensor' ? -Math.cos(th) : Math.cos(th), fy = mech ? 0 : o.type === 'sensor' ? -Math.sin(th) : Math.sin(th);
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    // 누운 종이는 위에 구슬이 올려져 있으니 아래쪽부터, 세운 종이·로드셀은 옆쪽부터 찾는다
    // 진자는 축 오른쪽(줄과 다른 부품을 피해)
    const upright = o.type === 'paper' && Math.abs(Math.sin(th)) > 0.5;
    const below = o.type === 'paper' && !upright, aside = o.type === 'loadcell' || o.type === 'pendulum' || upright, pend = o.type === 'pendulum';
    const spots = [
      { skip: fy < -0.6 || below || aside, x: cx - w / 2, y: bb[1] - h - gap },
      { skip: fy > 0.6 || aside, x: cx - w / 2, y: bb[3] + gap },
      { skip: fx > 0.6, x: bb[2] + gap, y: cy - h / 2 },
      { skip: fx < -0.6 || pend, x: bb[0] - w - gap, y: cy - h / 2 },
      { skip: false, x: cx - w / 2, y: bb[1] - h - gap },
    ];
    const fits = s => s.x >= 2 * px && s.y >= 2 * px && s.x + w <= W - 2 * px && s.y + h <= H - 2 * px;
    const spot = spots.find(s => !s.skip && fits(s)) || spots.find(s => !s.skip) || spots[0];
    const x = clamp(spot.x, 4 * px, W - w - 4 * px), y = clamp(spot.y, 4 * px, H - h - 4 * px);
    c.translate(x + w / 2, y + h / 2); c.rotate(-0.025);
    c.scale(px, px);
    tapePath(c, -w / 2 / px, -h / 2 / px, w / px, h / px);
    c.fillStyle = C.tape; c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 4; c.shadowOffsetY = 1; c.fill();
    c.shadowColor = 'transparent';
    c.fillStyle = C.tapeInk; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `${17 * ls}px "Nanum Pen Script", "Gaegu", cursive`;
    c.fillText(o.label, 0, 1.5);
    c.restore();
  }

  function worldBox(o) {
    const b = partGeom(o).g.box, th = o.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [lx, ly] of [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]]) {
      const x = o.x + lx * c - ly * s, y = o.y + lx * s + ly * c;
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    }
    return [x0, y0, x1, y1];
  }

  function knobPos(o) {
    const r = Math.max(PARTS[o.type].radius, 30 / scale);
    const th = o.rot * Math.PI / 180;
    return { x: o.x + r * Math.sin(th), y: o.y - r * Math.cos(th), r };
  }

  function drawSelection(c, o, px) {
    const k = knobPos(o);
    c.save();
    c.setLineDash([4 * px, 4 * px]);
    c.strokeStyle = 'rgba(243,196,71,0.55)'; c.lineWidth = px;
    c.beginPath(); c.arc(o.x, o.y, k.r, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    c.beginPath(); c.moveTo(o.x, o.y); c.lineTo(k.x, k.y); c.strokeStyle = 'rgba(243,196,71,0.4)'; c.stroke();
    c.beginPath(); c.arc(o.x, o.y, 2.5 * px, 0, Math.PI * 2); c.fillStyle = C.accent; c.fill();
    c.beginPath(); c.arc(k.x, k.y, 8 * px, 0, Math.PI * 2); c.fillStyle = C.accent; c.fill();
    c.strokeStyle = '#1a1606'; c.lineWidth = 1.4 * px;
    c.beginPath(); c.arc(k.x, k.y, 4 * px, -Math.PI * 0.9, Math.PI * 0.35); c.stroke();
    if (drag && drag.kind === 'rotate') {
      c.font = `600 ${12 * px}px "IBM Plex Mono", ui-monospace, monospace`;
      c.fillStyle = C.accent; c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(`${fmtDeg(o.rot)}°`, k.x + 13 * px, k.y);
    }
    c.restore();
  }

  const fmtDeg = d => (Math.round(normDeg(d) * 10) / 10).toFixed(1);

  /* ---------- 단단한 배치 ----------
     부품은 다른 물체(고정 장치·구슬·다른 부품)와 겹치는 자세로 놓을 수 없다.
     겹치는 조작은 거부하고 이전 자세로 되돌리며, 부품을 잠깐 붉게 표시한다 */
  let blocked = null; // { id, until }
  function tryPose(o, x, y, rot) {
    const px = o.x, py = o.y, pr = o.rot;
    o.x = x; o.y = y; o.rot = rot;
    if (o.hidden || !MECH.overlaps(o, S.objs)) return true;
    o.x = px; o.y = py; o.rot = pr;
    blocked = { id: o.id, until: performance.now() + 350 };
    dirty = true;
    return false;
  }
  const tryMove = (o, x, y) => tryPose(o, clamp(x, 8, W - 8), clamp(y, 8, H - 8), o.rot);
  const tryRot = (o, rot) => tryPose(o, o.x, o.y, normDeg(rot));

  function drawBlocked(c, o, px) {
    const sh = MECH.solidOf(o);
    c.save();
    c.strokeStyle = 'rgba(239,68,68,0.9)'; c.lineWidth = 2 * px; c.lineJoin = 'round';
    for (const poly of sh.polys) { c.beginPath(); poly.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke(); }
    for (const [x, y, r] of sh.circles) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); }
    c.restore();
  }

  /* ---------- 조작 ---------- */
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H,
      inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
    };
  }

  function localOf(o, x, y) {
    const th = o.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
    const dx = x - o.x, dy = y - o.y;
    return { x: dx * c + dy * s, y: -dx * s + dy * c };
  }

  function pick(p) {
    const pad = 10 + 6 / scale;
    for (let i = S.objs.length - 1; i >= 0; i--) {
      const o = S.objs[i];
      if (o.locked || o.hidden || o.type === 'wall') continue;
      const b = partGeom(o).g.box, l = localOf(o, p.x, p.y);
      if (l.x >= b[0] - pad && l.x <= b[2] + pad && l.y >= b[1] - pad && l.y <= b[3] + pad) return o;
    }
    return null;
  }

  function select(o) { S.sel = o ? o.id : null; dirty = true; updateSelPanel(); }

  cv.addEventListener('pointerdown', e => {
    if (S.overlay) return;
    const p = toWorld(e), sel = selObj();
    const tol = (e.pointerType === 'touch' ? 22 : 13) / scale;
    if (sel) {
      const k = knobPos(sel);
      if (Math.hypot(p.x - k.x, p.y - k.y) < tol) {
        drag = { kind: 'rotate', obj: sel };
        cv.setPointerCapture(e.pointerId); e.preventDefault(); dirty = true; return;
      }
    }
    const o = pick(p);
    if (o) {
      select(o);
      drag = { kind: 'move', obj: o, dx: o.x - p.x, dy: o.y - p.y };
      // 맨 위로
      S.objs.splice(S.objs.indexOf(o), 1); S.objs.push(o);
      cv.setPointerCapture(e.pointerId); e.preventDefault();
      cv.style.cursor = 'grabbing';
      dismissCoach();
    } else select(null);
  });

  cv.addEventListener('pointermove', e => {
    const p = toWorld(e);
    if (!drag) {
      const sel = selObj();
      let cur = 'default';
      if (sel) { const k = knobPos(sel); if (Math.hypot(p.x - k.x, p.y - k.y) < 13 / scale) cur = 'alias'; }
      if (cur === 'default' && pick(p)) cur = 'grab';
      cv.style.cursor = cur;
      return;
    }
    onDragMove(e, p);
  });

  function onDragMove(e, p) {
    const o = drag.obj;
    if (drag.kind === 'move') {
      const out = !p.inside && !o.locked && (S.mode === 'lab' ? o.type !== 'source' && o.type !== 'sensor' : true);
      if (out) { o.hidden = true; o.x = clamp(p.x + drag.dx, 8, W - 8); o.y = clamp(p.y + drag.dy, 8, H - 8); }
      else {
        // 판 밖에 있던 부품이 겹치는 자리로 들어오면 빈자리를 찾을 때까지 숨긴 채로 둔다
        const was = o.hidden; o.hidden = false;
        if (!tryMove(o, p.x + drag.dx, p.y + drag.dy) && was) o.hidden = true;
      }
      boardWrap.classList.toggle('dropping-out', out);
    } else if (drag.kind === 'rotate') {
      let a = Math.atan2(p.y - o.y, p.x - o.x) * 180 / Math.PI + 90;
      a = e.shiftKey ? Math.round(a / 15) * 15 : Math.round(a * 10) / 10;
      tryRot(o, a);
    }
    retrace();
  }

  function endDrag() {
    if (!drag) return;
    const o = drag.obj;
    if (drag.kind === 'move' && o.hidden) returnToInv(o);
    drag = null;
    boardWrap.classList.remove('dropping-out');
    cv.style.cursor = 'default';
    retrace();
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  cv.addEventListener('wheel', e => {
    const sel = selObj();
    if (!sel || S.overlay) return;
    const p = toWorld(e);
    if (Math.hypot(p.x - sel.x, p.y - sel.y) > knobPos(sel).r + 20) return;
    e.preventDefault();
    const step = e.shiftKey ? 10 : 0.5;
    tryRot(sel, sel.rot + (e.deltaY > 0 ? step : -step));
    retrace();
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
    if (!picker.hidden) { if (e.key === 'Escape') closePicker(); return; }
    if (S.overlay) { if (e.key === 'Escape') hideClear(); return; }
    const sel = selObj();
    if (!sel) return;
    let used = true;
    const big = e.shiftKey ? 10 : 1;
    switch (e.key) {
      case 'q': case 'Q': case '[': tryRot(sel, sel.rot - (e.shiftKey ? 10 : 0.5)); break;
      case 'e': case 'E': case ']': tryRot(sel, sel.rot + (e.shiftKey ? 10 : 0.5)); break;
      case 'ArrowLeft': tryMove(sel, sel.x - big, sel.y); break;
      case 'ArrowRight': tryMove(sel, sel.x + big, sel.y); break;
      case 'ArrowUp': tryMove(sel, sel.x, sel.y - big); break;
      case 'ArrowDown': tryMove(sel, sel.x, sel.y + big); break;
      case 'Delete': case 'Backspace': if (canReturn(sel)) returnToInv(sel); else used = false; break;
      case 'Escape': select(null); break;
      default: used = false;
    }
    if (used) { e.preventDefault(); retrace(); }
  });

  const canReturn = o => !o.locked && !(S.mode === 'lab' && (o.type === 'source' || o.type === 'sensor'));

  function returnToInv(o) {
    if (!canReturn(o)) { o.hidden = false; return; }
    S.objs.splice(S.objs.indexOf(o), 1);
    const k = o.key || o.type;
    if (S.inv[k] !== Infinity) S.inv[k] = (S.inv[k] || 0) + 1;
    if (S.sel === o.id) S.sel = null;
    updateInv();
    retrace();
  }

  // 부품함 칸(key) → 실제 부품 종류·매개변수·이름. 같은 종류라도 초점거리가 다르면 칸이 따로 있다
  function partDef(key) {
    const st = S.mode === 'stage' ? STAGES[S.stage] : null;
    const v = st && st.parts && st.parts[key];
    const type = v ? v.type : key;
    const extra = st ? ((st.partParams || {})[key] || {}) : {};
    const params = Object.assign({}, extra, v ? v.params : {});
    const name = (v && v.name) || (st && (st.partNames || {})[key]) || PARTS[type].name;
    return { type, params, name };
  }

  function newPiece(key) {
    const d = partDef(key), params = { ...d.params };
    if (S.mode === 'lab' && d.type === 'slit') params.gap = S.lab.gap;
    return { type: d.type, key, x: W / 2, y: H / 2, rot: DEFAULT_ROT[d.type] || 0, params, id: uid++, locked: false };
  }

  // 새 부품 o를 놓을 빈자리: 다른 물체와 겹치지 않고 되도록 떨어진 곳
  function freeSpot(o) {
    const cands = [];
    for (let r = 0; r < 6; r++) for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4 + r * 0.4;
      cands.push({ x: W * 0.45 + Math.cos(ang) * r * 70, y: H * 0.5 + Math.sin(ang) * r * 55 });
    }
    const fits = c => { o.x = c.x; o.y = c.y; return !MECH.overlaps(o, S.objs); };
    for (const pass of [95, 0]) {
      for (const c of cands) {
        if (c.x < 60 || c.x > W - 60 || c.y < 60 || c.y > H - 60) continue;
        if (S.objs.every(k => k === o || k.hidden || Math.hypot(k.x - c.x, k.y - c.y) > pass) && fits(c)) return c;
      }
    }
    return { x: W / 2, y: H / 2 };
  }

  function commitPiece(o) {
    const k = o.key || o.type;
    if (S.inv[k] !== Infinity) S.inv[k]--;
    S.placed = true;
    dismissCoach();
    updateInv();
  }

  /* ---------- 배치 ---------- */
  const boardWrap = $('#boardWrap');
  const panel = $('#panel');
  const gameEl = $('.game'), dockEl = $('#dock');
  // 세로 화면에서는 CSS가 위아래로 쌓고, 정반은 너비 100%로 두어 페이지를 스크롤한다
  const stackedMQ = matchMedia('(max-aspect-ratio: 1/1), (max-width: 760px)');
  // 가로 화면: 정반은 (남는 높이 − 부품 선반)과 (너비 − 패널 최소 폭) 안에서 가장 크게, 패널이 나머지를 차지한다
  const boardCol = $('.board-col');
  const appEl = $('.app'), colsEl = $('#cols'), colL = $('#colL'), colC = $('#colC'), colR = $('#colR');
  // 스마트폰 가로보기: 가로이면서 높이가 낮다 (전체 화면이든 아니든)
  const compactMQ = matchMedia('(min-aspect-ratio: 1/1) and (max-height: 560px)');
  /* 기존 요소들을 compact 세 기둥으로 옮기거나 제자리로 되돌린다. 부모 안 순서는 배열 순서.
     .mission/.readout은 buildPanel이 다시 만드므로 그때마다 다시 부른다. */
  const panelFoot = $('.panel-foot'), topEl = $('.top');
  function slot() {
    const compact = compactMQ.matches;
    document.documentElement.classList.toggle('compact', compact);
    colsEl.hidden = !compact;
    const place = (parent, kids) => { for (const k of kids) if (k) parent.appendChild(k); };
    const q = s => document.querySelector(s);
    const mission = q('.mission'), readout = q('.readout'), phys = q('.phys');
    if (compact) {
      place(colL, [topEl, mission, statusBar, $('#actions')]);
      place(colC, [boardWrap, $('#selSec')]);
      place(colR, [dockEl, readout]);
      if (phys) panel.appendChild(phys);
    } else {
      place(appEl, [topEl, colsEl, gameEl]);
      place(panel, [mission, readout, phys]);
      place(panelFoot, [statusBar, $('#selSec'), $('#actions')]);
      place(boardCol, [boardWrap, dockEl]);
    }
    layoutBoard();
  }
  function layoutBoard() {
    if (compactMQ.matches) {
      boardCol.style.width = '';
      const availH = colC.clientHeight - $('#selSec').offsetHeight - 6;
      const availW = colC.clientWidth;
      const w = Math.floor(Math.max(200, Math.min(availH * W / H, availW)));
      boardWrap.style.width = `${w}px`;
      boardWrap.style.height = `${Math.floor(w * H / W)}px`;
      $('#selSec').style.width = `${w}px`;
      return;
    }
    boardWrap.style.width = ''; $('#selSec').style.width = '';
    if (stackedMQ.matches) { boardCol.style.width = ''; boardWrap.style.height = ''; return; }
    const gap = 8, panelMin = 300 + 12;
    const availH = gameEl.clientHeight - dockEl.offsetHeight - gap;
    const availW = gameEl.clientWidth - panelMin;
    const w = Math.floor(Math.max(360, Math.min(availH * W / H, availW)));
    boardCol.style.width = `${w}px`;
    boardWrap.style.height = `${Math.floor(w * H / W)}px`;
  }

  /* 전체 화면. Android/데스크톱은 Fullscreen API(+가로 고정), iPhone Safari는 API가 없어 홈 화면 추가 안내 */
  const fsBtn = $('#fsBtn'), docEl = document.documentElement;
  const fsRequest = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
  const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (!fsRequest && standalone) fsBtn.hidden = true;
  let toastTimer = 0;
  function toast(msg, ms = 4200) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
  }
  async function toggleFullscreen() {
    if (!fsRequest) {
      toast(standalone ? '기기를 가로로 돌리면 한 화면 배치로 바뀝니다.' : 'iPhone은 Safari 공유 ▸ ‘홈 화면에 추가’로 열면 전체 화면이 돼요. 가로로 돌리면 한 화면 배치로 바뀝니다.');
      return;
    }
    try {
      if (fsEl()) { await fsExit.call(document); return; }
      await fsRequest.call(docEl, { navigationUI: 'hide' });
      if (screen.orientation && screen.orientation.lock && matchMedia('(pointer: coarse)').matches) screen.orientation.lock('landscape').catch(() => {});
    } catch (e) {
      toast('이 브라우저에서는 전체 화면을 열 수 없어요.');
    }
  }
  function updateFs() {
    const on = !!fsEl();
    fsBtn.setAttribute('aria-pressed', String(on));
    fsBtn.title = fsBtn.ariaLabel = on ? '전체 화면 끝내기' : '전체 화면';
    if (!on && screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) { /* 잠금한 적 없음 */ } }
  }
  fsBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFs);
  document.addEventListener('webkitfullscreenchange', updateFs);
  const stageOf = () => STAGES[S.stage];
  const partName = k => partDef(k).name;
  const partParamsOf = k => Object.assign({}, PARTS[partDef(k).type].defaults, partDef(k).params);
  function partSpec(t, p) {
    if (t.startsWith('lens') || t === 'mirrorConcave' || t === 'mirrorConvex') return `f ${p.f < 0 ? '−' + Math.abs(p.f) : p.f}`;
    if (t === 'slit') return `폭 ${S.mode === 'lab' ? S.lab.gap : p.gap}`;
    if (t === 'mirror') return `${2 * p.h} mm`;
    if (t === 'plank') return `${p.len} mm`;
    if (t === 'splitter') return `R ${Math.round(p.r * 100)}%`;
    if (t === 'filter') return `${p.excl ? '차단 ' : ''}${p.min}–${p.max} nm`;
    if (t === 'prismRight') return '45·45·90°';
    return '60°';
  }

  // 판독 패널에 보여줄 장치: 목표가 있는 센서·로드셀, 그리고 모든 종이(집광 정도)
  const goalDevices = () => S.objs.filter(o => !o.hidden && (o.type === 'sensor' ? (S.mode === 'lab' || o.goal) : o.type === 'paper' || ((o.type === 'loadcell' || o.type === 'pendulum') && o.goal)));

  function buildPanel() {
    // compact 기둥으로 옮겨졌던 이전 스테이지의 미션·판독은 새로 만들므로 지운다
    colL.querySelectorAll('.mission').forEach(el => el.remove());
    colR.querySelectorAll('.readout').forEach(el => el.remove());
    let html = '';
    if (S.mode === 'stage') {
      const st = stageOf();
      html += `
        <section class="sec mission">
          <button class="tape tape-lg tape-btn" id="missionPick" aria-haspopup="dialog" aria-controls="stagePick" title="스테이지 고르기">스테이지 ${st.id} · ${st.title}<span class="caret">▾</span></button>
          <p class="tools"><span>도구</span>${st.tools}</p>
          <p class="brief">${st.brief}</p>
          <div id="hintBox"></div>
        </section>`;
    } else {
      html += `
        <section class="sec mission">
          <div class="tape tape-lg">자유 실험실</div>
          <p class="brief">부품을 마음껏 놓아 보세요. 광원과 센서도 옮기고 돌릴 수 있어요.</p>
          <div class="ctrl">
            <div class="seg" role="group" aria-label="광원 종류">
              <button id="specWhite" class="seg-b" aria-pressed="${S.lab.spectrum === 'white'}">백색광</button>
              <button id="specMono" class="seg-b" aria-pressed="${S.lab.spectrum === 'mono'}">단색광</button>
            </div>
            <label class="slider" ${S.lab.spectrum === 'mono' ? '' : 'hidden'} id="lamWrap">
              <span class="sw" id="lamSw"></span>
              <input id="lam" type="range" min="400" max="700" step="5" value="${S.lab.lambda}" aria-label="파장">
              <span class="mono" id="lamVal">${S.lab.lambda} nm</span>
            </label>
            <div class="seg" role="group" aria-label="빔 굵기">
              <button id="beamThin" class="seg-b" aria-pressed="${!S.lab.wide}">가는 빔</button>
              <button id="beamWide" class="seg-b" aria-pressed="${S.lab.wide}">넓은 평행광</button>
            </div>
            <label class="slider">
              <span class="lab-s">슬릿 폭</span>
              <input id="gap" type="range" min="6" max="60" step="1" value="${S.lab.gap}" aria-label="슬릿 폭">
              <span class="mono" id="gapVal">${S.lab.gap} mm</span>
            </label>
          </div>
        </section>`;
    }
    const sensors = goalDevices();
    const multi = sensors.length > 1;
    html += `
      <section class="sec readout">
        <div class="sec-h"><span>센서 판독</span><span class="mono dim" id="hitCount"></span></div>
        <div class="rds">
          ${sensors.map((o, i) => `
            <div class="rd" data-i="${i}" data-type="${o.type}">
              ${multi ? `<div class="rd-h"><span class="rd-name">${o.label || PARTS[o.type].name}</span><span class="mono dim rd-n"></span></div>` : ''}
              ${o.type === 'sensor' ? `<canvas class="spec" aria-label="${o.label || '센서'}가 받은 빛의 스펙트럼"></canvas>` : ''}
              <div class="meters"></div>
            </div>`).join('')}
        </div>
      </section>
      <details class="sec phys">
        <summary>조작법과 이 실험대의 물리</summary>
        <ul>
          <li><b>꺼내기</b> 아래 부품함에서 정반으로 끌어 놓거나, 눌러서 빈자리에 꺼내기</li>
          <li><b>이동</b> 부품을 끌기 · 방향키 1 mm (Shift 10 mm)</li>
          <li><b>회전</b> 노란 손잡이 끌기 · 오른쪽 아래 각도 버튼 · 마우스 휠 · Q/E 0.5° (Shift 10°)</li>
          <li><b>회수</b> 판 밖으로 끌어내기 · 회수 버튼 · Delete</li>
          <li><b>단단한 물체</b> 부품은 받침대·구슬·다른 부품과 겹치게 놓을 수 없어요. 겹치는 자리로는 움직이지 않고 붉게 표시돼요</li>
          <li><b>정반</b> 구멍 간격 25 mm · 볼트 표시는 고정 부품</li>
        </ul>
        <p>굴절은 스넬 법칙으로, 거울은 반사 법칙으로 계산합니다. 프리즘 안에서 임계각을 넘으면 전반사가 일어나요.</p>
        <p>프리즘 유리는 색 분리가 잘 보이도록 분산을 과장했어요. n = 1.67(400 nm) ~ 1.50(700 nm). 렌즈는 분산이 작은 유리(n ≈ 1.52)예요. 렌즈와 곡면 거울의 초점거리 f는 부품함에 적혀 있어요.</p>
        <p>회절은 다루지 않는 기하광학 모형입니다. 볼트 표시가 있는 부품은 정반에 고정되어 움직일 수 없어요.</p>
        <p><b>역학</b> 종이는 받은 빛이 14 mm 안에 기준 세기 이상 모이면 타서 사라집니다(종이 색과 같은 빛은 반사되어 소용없어요). 위아래 양면에 받은 빛은 합산돼요. 쇠구슬은 빛을 막으므로 구슬이 비키면 그 뒤의 센서가 빛을 받습니다(센서 판정은 실험이 끝난 상태 기준). 쇠구슬은 중력 4 m/s²의 작은 실험대에서 굴러가며(속이 찬 구: 가속도 5/7배), 판자·벽·렌즈·프리즘 등 모든 부품에 부딪혀 튀어요. 구슬끼리의 충돌과 진자와의 충돌은 운동량이 보존되는 탄성 충돌이라, 질량이 큰 쪽(어두운 납 구슬·무거운 추)은 느리게 밀리고 가벼운 쪽은 되튜어요. 로드셀은 접촉과 충돌 속도를 재요. 지레는 받침점을 축으로 돌아가며, 구슬의 무게 × 축까지의 거리가 토크가 돼요(멈춤쇠 각도까지만 돌고, 종이 걸쇠가 끝을 누르고 있으면 꼼짝 못 해요). 둥근 슬라이드는 안쪽 면을 따라 구슬을 미끄러뜨려 방향을 바꿔요. 배치를 바꾸면 8초짜리 실험이 처음부터 다시 재생됩니다.</p>
      </details>`;
    panel.innerHTML = html;
    $('#actions').innerHTML = S.mode === 'stage'
      ? `<button class="btn" id="hintBtn">힌트 보기</button><button class="btn" id="answerBtn">정답 보기</button><button class="btn ghost" id="resetBtn">처음부터</button>`
      : `<button class="btn" id="clearAll">부품 모두 회수</button>`;
    panel.scrollTop = 0;
    slot();
    bindPanel();
    updateInv();
    updateSelPanel();
    updateCoach();
    resizeSpec();
    updateReadout();
  }

  function bindPanel() {
    const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
    on('hintBtn', 'click', () => {
      S.hintStep = Math.min(stageOf().hints.length, S.hintStep + 1);
      renderHints();
      const box = $('#hintBox'); if (box && box.lastElementChild) box.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    on('answerBtn', 'click', () => openModal());
    on('resetBtn', 'click', () => { loadStage(S.stage); });
    on('clearAll', 'click', () => {
      S.objs.filter(o => canReturn(o)).forEach(o => S.objs.splice(S.objs.indexOf(o), 1));
      S.sel = null; updateInv(); retrace();
    });
    on('specWhite', 'click', () => { S.lab.spectrum = 'white'; labChanged(true); });
    on('specMono', 'click', () => { S.lab.spectrum = 'mono'; labChanged(true); });
    on('beamThin', 'click', () => { S.lab.wide = false; labChanged(true); });
    on('beamWide', 'click', () => { S.lab.wide = true; labChanged(true); });
    on('lam', 'input', e => { S.lab.lambda = +e.target.value; labChanged(false); });
    on('gap', 'input', e => { S.lab.gap = +e.target.value; labChanged(false); updateInv(); });
    renderHints();
    paintLam();
  }

  function labChanged(rebuild) {
    applyLabSource();
    if (rebuild) {
      $('#specWhite').setAttribute('aria-pressed', S.lab.spectrum === 'white');
      $('#specMono').setAttribute('aria-pressed', S.lab.spectrum === 'mono');
      $('#beamThin').setAttribute('aria-pressed', !S.lab.wide);
      $('#beamWide').setAttribute('aria-pressed', S.lab.wide);
      $('#lamWrap').hidden = S.lab.spectrum !== 'mono';
    }
    const lv = $('#lamVal'); if (lv) lv.textContent = `${S.lab.lambda} nm`;
    const gv = $('#gapVal'); if (gv) gv.textContent = `${S.lab.gap} mm`;
    paintLam();
    retrace();
  }

  function paintLam() {
    const sw = $('#lamSw'); if (sw) sw.style.background = rgba(colOf(S.lab.lambda), 1);
  }

  function renderHints() {
    const box = $('#hintBox'); if (!box) return;
    if (S.mode !== 'stage') { box.innerHTML = ''; return; }
    const st = stageOf();
    box.innerHTML = st.hints.slice(0, S.hintStep).map((h, i) => `<p class="hint"><span class="mono">${i + 1}</span>${h}</p>`).join('');
    const btn = $('#hintBtn');
    if (btn) { btn.disabled = S.hintStep >= st.hints.length; btn.textContent = S.hintStep ? `힌트 ${S.hintStep}/${st.hints.length}` : '힌트 보기'; }
  }

  /* 부품함 */
  const iconCache = {};
  function partIcon(type, params) {
    const key = type + JSON.stringify(params);
    if (iconCache[key]) return iconCache[key];
    const c = document.createElement('canvas');
    const d = Math.min(2.5, window.devicePixelRatio || 1);
    c.width = 56 * d; c.height = 44 * d;
    const x = c.getContext('2d');
    const r = PARTS[type].radius;
    const k = (34 / (r * 1.45)) * d;
    x.setTransform(k, 0, 0, k, c.width / 2, c.height / 2);
    const o = { type, x: 0, y: type === 'prism' ? 8 : 0, rot: 0, params: { ...params, ...(type === 'slit' ? { gap: 22 } : {}) } };
    drawObj(x, o, d / k);
    iconCache[key] = c.toDataURL();
    return iconCache[key];
  }

  function updateInv() {
    const box = $('#inv'); if (!box) return;
    const types = S.mode === 'lab' ? LAB_PARTS : Object.keys(S.inv);
    box.innerHTML = types.map(t => {
      const n = S.inv[t], p = partParamsOf(t), ty = partDef(t).type;
      const cnt = n === Infinity ? '∞' : `×${n}`;
      return `<button class="part" data-key="${t}" ${n > 0 ? '' : 'disabled'} aria-label="${partName(t)} ${partSpec(ty, p)}, ${n === Infinity ? '무제한' : n + '개'}">
        <img src="${partIcon(ty, p)}" alt="" width="56" height="44"><span class="pn">${partName(t)}</span><span class="pf mono">${partSpec(ty, p)}</span><span class="pc mono">${cnt}</span></button>`;
    }).join('');
    box.querySelectorAll('.part').forEach(bindPart);
  }

  function bindPart(btn) {
    const type = btn.dataset.key;
    let st = null;
    btn.addEventListener('pointerdown', e => {
      if (btn.disabled || S.overlay || !(S.inv[type] > 0)) return;
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      st = { sx: e.clientX, sy: e.clientY, obj: null };
    });
    btn.addEventListener('pointermove', e => {
      if (!st) return;
      if (!st.obj) {
        if (Math.hypot(e.clientX - st.sx, e.clientY - st.sy) < 6) return;
        st.obj = newPiece(type); st.obj.hidden = true;
        S.objs.push(st.obj); select(st.obj);
        drag = { kind: 'new', obj: st.obj };
      }
      const p = toWorld(e), o = st.obj;
      if (!p.inside) { o.hidden = true; o.x = clamp(p.x, 8, W - 8); o.y = clamp(p.y, 8, H - 8); }
      else {
        // 겹치는 자리에서는 빈자리를 찾을 때까지 숨긴 채로 따라온다 (그대로 놓으면 부품함으로 돌아간다)
        const was = o.hidden; o.hidden = false;
        if (!tryMove(o, p.x, p.y) && was) o.hidden = true;
      }
      retrace();
    });
    const up = () => {
      if (!st) return;
      const o = st.obj; st = null; drag = null;
      if (!o) {
        const o2 = newPiece(type), sp = freeSpot(o2);
        o2.x = sp.x; o2.y = sp.y;
        S.objs.push(o2); commitPiece(o2); select(o2);
      } else if (o.hidden) {
        S.objs.splice(S.objs.indexOf(o), 1); S.sel = null;
      } else commitPiece(o);
      retrace();
    };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', () => {
      if (st && st.obj) { S.objs.splice(S.objs.indexOf(st.obj), 1); S.sel = null; }
      st = null; drag = null; retrace();
    });
  }

  /* 선택한 부품 */
  function updateSelPanel() {
    const box = $('#selBody'); if (!box) return;
    const o = selObj();
    if (!o || o.hidden) {
      box.innerHTML = `<p class="dim small sel-empty">판 위의 부품을 누르면 여기서 각도와 위치를 정밀하게 조정할 수 있어요.</p>`;
      box.dataset.id = '';
      return;
    }
    if (box.dataset.id !== String(o.id)) {
      box.dataset.id = String(o.id);
      box.innerHTML = `
        <div class="sel-top"><b id="selName"></b><span class="mono dim" id="selPos"></span><button class="btn sm ghost" id="selRet">회수</button></div>
        <div class="rot-row">
          <button class="btn sm" data-r="-10" aria-label="반시계 10도">−10°</button>
          <button class="btn sm" data-r="-0.5" aria-label="반시계 0.5도">−0.5°</button>
          <span class="mono ang" id="selAng"></span>
          <button class="btn sm" data-r="0.5" aria-label="시계 0.5도">+0.5°</button>
          <button class="btn sm" data-r="10" aria-label="시계 10도">+10°</button>
        </div>`;
      box.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
        const s = selObj(); if (!s) return; tryRot(s, s.rot + +b.dataset.r); retrace();
      }));
      $('#selRet').addEventListener('click', () => { const s = selObj(); if (s) returnToInv(s); });
    }
    $('#selName').textContent = PARTS[o.type].short ? partName(o.key || o.type) : (o.label || PARTS[o.type].name);
    $('#selPos').textContent = `x ${Math.round(o.x)} · y ${Math.round(o.y)} mm`;
    $('#selAng').textContent = `${fmtDeg(o.rot)}°`;
    $('#selRet').hidden = !canReturn(o);
  }

  /* 판독기 */
  function resizeSpec() {
    const multi = goalDevices().length > 1;
    document.querySelectorAll('canvas.spec').forEach(cv2 => {
      const w = cv2.getBoundingClientRect().width || 280, h = compactMQ.matches ? 46 : multi ? 70 : 92;
      const d = Math.min(2.5, window.devicePixelRatio || 1);
      cv2.style.height = `${h}px`;
      cv2.width = Math.round(w * d); cv2.height = Math.round(h * d);
      cv2._d = d; cv2._w = w; cv2._h = h;
    });
  }

  function drawSpectrum(cv2, res) {
    const c = cv2.getContext('2d'), d = cv2._d || 1, w = cv2._w || 280, h = cv2._h || 92;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.clearRect(0, 0, w, h);
    const x0 = 6, x1 = w - 6, top = 17, base = h - 26;
    const X = l => x0 + (l - 400) / 300 * (x1 - x0);
    c.fillStyle = '#0b0e12'; c.fillRect(0, 0, w, h);
    // 목표 대역
    const bandCheck = res && res.obj.goal && res.obj.goal.checks.find(k => k.band);
    if (bandCheck) {
      const a = X(bandCheck.band[0] - 2.5), b = X(bandCheck.band[1] + 2.5);
      c.fillStyle = 'rgba(232,217,160,0.07)'; c.fillRect(a, 0, b - a, base);
      c.setLineDash([3, 3]); c.strokeStyle = 'rgba(232,217,160,0.6)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(a + 0.5, top - 2); c.lineTo(a + 0.5, base); c.moveTo(b - 0.5, top - 2); c.lineTo(b - 0.5, base); c.stroke();
      c.setLineDash([]);
      c.fillStyle = 'rgba(232,217,160,0.9)'; c.font = '600 10px "IBM Plex Sans KR", system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText('목표', (a + b) / 2, 3);
    }
    for (let l = 400; l <= 700; l += 2) {
      c.fillStyle = rgba(colOf(l), 0.5); c.fillRect(X(l), base + 3, (x1 - x0) / 150 + 0.6, 4);
    }
    const perLam = new Map();
    for (const l of R.emitted) perLam.set(l, (perLam.get(l) || 0) + 1);
    const got = new Map();
    if (res) for (const hh of res.hits) got.set(hh.lambda, (got.get(hh.lambda) || 0) + hh.I);
    const lams = [...perLam.keys()].sort((a, b) => a - b);
    const stepNm = lams.length > 1 ? Math.min(...lams.slice(1).map((l, i) => l - lams[i])) : 5;
    const bw = Math.max(2, (x1 - x0) / 300 * Math.min(10, stepNm) * 0.72);
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const l of lams) {
      const v = (got.get(l) || 0) / perLam.get(l);
      if (!v) continue;
      const bh = (base - top) * Math.min(1, v), col = colOf(l);
      const g = c.createLinearGradient(0, base - bh, 0, base);
      g.addColorStop(0, rgba(col, 1)); g.addColorStop(1, rgba(col, 0.35));
      c.fillStyle = g; c.fillRect(X(l) - bw / 2, base - bh, bw, bh);
    }
    c.restore();
    c.fillStyle = '#7f8896'; c.font = '10px "IBM Plex Mono", ui-monospace, monospace';
    c.textBaseline = 'top';
    const narrow = w < 180;   // compact 판독기: 양 끝 눈금만
    for (const l of narrow ? [400, 700] : [400, 500, 600, 700]) {
      c.textAlign = l === 400 ? 'left' : l === 700 ? 'right' : 'center';
      c.fillText(String(l), X(l), base + 10);
    }
    c.textAlign = 'center'; c.fillText('nm', (X(500) + X(600)) / 2, base + 10);
  }

  function updateReadout() {
    if (!S) return;
    const sensors = goalDevices();
    const blocks = document.querySelectorAll('.rd');
    let totalHits = 0;
    blocks.forEach(bl => {
      const o = sensors[+bl.dataset.i];
      const res = evalRes.find(r => r.obj === o);
      if (!res) return;
      if (o.type === 'sensor') totalHits += res.hits.length;
      const spec = bl.querySelector('canvas.spec');
      if (spec) drawSpectrum(spec, res);
      const n = bl.querySelector('.rd-n');
      if (n) n.textContent = o.type === 'loadcell' ? (res.hit ? (res.hit.by === 'bob' ? '추가 닿음' : '구슬이 닿음') : '대기 중') : o.type === 'pendulum' ? (res.struck ? '충돌' : '정지') : o.type === 'paper' ? (res.ok ? '타버렸어요' : res.hits.length ? `${res.hits.length}줄 받음` : '빛 없음') : res.hits.length ? `${res.hits.length}줄` : '빛 없음';
      const m = bl.querySelector('.meters');
      if (res.checks) {
        m.innerHTML = res.checks.map(k => `
          <div class="meter ${k.ok ? 'ok' : ''}">
            <div class="m-top"><span>${k.label}</span><span class="mono"><b>${k.text}</b> / ${k.needText}</span></div>
            <div class="m-bar"><i style="width:${Math.min(100, k.frac * 100)}%"></i><s style="left:${Math.min(100, k.need * 100)}%"></s></div>
          </div>`).join('') + `<p class="verdict ${res.ok ? 'ok' : ''}">${verdict(res)}</p>`;
      } else {
        const names = [...new Set(res.hits.map(hh => OPT.bandName(hh.lambda)))];
        m.innerHTML = `<p class="verdict">${names.length ? '받은 색: ' + names.join(' · ') : '센서에 닿은 빛이 없어요.'}</p>`;
      }
    });
    const hc = $('#hitCount');
    if (hc) hc.textContent = sensors.length > 1 ? '' : (totalHits ? `${totalHits}줄 수신` : '빛 없음');
  }

  function verdict(r) {
    if (r.obj.type === 'paper') {
      if (r.ok) {
        if (S.revealed) return '정답 배치에서 종이가 타요.';
        // 종이 위에 구슬이 얹혀 있으면 떨어지고, 아니면(걸쇠·문·다리) 길이 열린다
        const o = r.obj, p = Object.assign({}, PARTS.paper.defaults, o.params || {}), th = o.rot * Math.PI / 180;
        const onTop = Math.abs(Math.cos(th)) > 0.5 && S.objs.some(b => {
          if (b.type !== 'ball' || b.hidden) return false;
          const br = (b.params && b.params.r) || PARTS.ball.defaults.r;
          return Math.abs(b.x - o.x) <= p.w / 2 && b.y < o.y && o.y - b.y < br + p.th + 4;
        });
        return onTop ? '종이가 타서 구슬이 떨어져요.' : '종이가 타서 길이 열려요.';
      }
      if (!r.hits.length) return '종이에 닿은 빛이 없어요.';
      if (r.reflected && r.reflected >= r.hits.length) return '종이 색과 같은 빛은 반사되어 달구지 않아요.';
      return '빛을 더 좍은 한 점에 모아야 타요.';
    }
    if (r.obj.type === 'pendulum') {
      if (r.ok) return S.revealed ? '정답 배치에서 조건이 충족돼요.' : '조건 충족';
      return r.struck ? '추가 더 크게 흔들려야 해요.' : '구슬이 추를 치지 않았어요.';
    }
    if (r.obj.type === 'loadcell') {
      if (r.ok) return S.revealed ? '정답 배치에서 조건이 충족돼요.' : '조건 충족';
      if (!r.hit) return '아직 아무것도 로드셀에 닿지 않았어요.';
      const bad = r.checks.find(k => !k.ok);
      return bad && bad.needText.includes('≤') ? '너무 세게 부딪혀요. 더 천천히 도착해야 해요.' : '너무 약하게 닿았어요. 더 빠르게 부딪혀야 해요.';
    }
    if (!r.hits.length) return '센서에 닿은 빛이 아직 없어요.';
    if (r.ok) return S.revealed ? '정답 배치에서 조건이 충족돼요.' : '조건 충족';
    const bad = r.checks.find(k => !k.ok);
    const g = r.obj.goal.checks[r.checks.indexOf(bad)];
    switch (bad.kind) {
      case 'purity': {
        const others = [...new Set(r.hits.filter(h => h.lambda < g.band[0] || h.lambda > g.band[1]).map(h => OPT.bandName(h.lambda)))];
        return `${others.join(' · ')} 빛이 섞여 있어요.`;
      }
      case 'band': return `${g.name} 빛이 너무 적게 들어와요.`;
      case 'band_max': return `${g.name} 빛이 아직 너무 많이 섞여 있어요.`;
      case 'power': return '빛이 더 많이 들어와야 해요.';
      case 'coverage': return '센서의 더 넓은 범위를 비춰야 해요.';
      case 'parallel': return '광선이 나란하지 않아요. 퍼지거나 모이고 있어요.';
      case 'white': return '빠진 색이 있어요. 모든 색을 한 점에 모아야 해요.';
    }
    return '조금만 더 맞춰 보세요.';
  }

  /* 코치 표식 */
  const coach = $('#coach');
  function updateCoach() {
    const st = stageOf();
    const show = S.mode === 'stage' && !S.placed && !S.revealed && st.coach;
    coach.hidden = !show;
    if (show) {
      coach.style.left = `${st.coach.x / W * 100}%`;
      coach.style.top = `${st.coach.y / H * 100}%`;
      coach.querySelector('span').textContent = st.coach.text;
    }
  }
  function dismissCoach() { if (S.mode === 'stage' && !S.placed && S.objs.some(o => !o.locked)) { S.placed = true; } updateCoach(); }

  /* 스테이지 이동: 머리띠의 ‹ 현재 › 와, 현재 버튼을 누르면 열리는 4×10 고르기 창 */
  const nav = $('#stageNav'), picker = $('#stagePick');
  const chip = (st, i) => `<button class="st-b mono" data-stage="${i}" title="${st.id}. ${st.title} (${st.tools})" aria-label="스테이지 ${st.id} ${st.title}">${String(st.id).padStart(2, '0')}</button>`;
  nav.innerHTML = [['기초', 0, 10], ['응용', 10, 20], ['확장', 20, 30], ['역학', 30, 40], ['종합', 40, STAGES.length]].map(([name, a, b]) =>
    `<div class="st-row"><span class="st-lab">${name}</span>${STAGES.slice(a, b).map((st, j) => chip(st, a + j)).join('')}</div>`).join('');
  nav.querySelectorAll('[data-stage]').forEach(b => {
    b.addEventListener('click', () => { closePicker(); loadStage(+b.dataset.stage); });
    const show = () => { const st = STAGES[+b.dataset.stage]; $('#pickFoot').innerHTML = `<b>${st.id}. ${st.title}</b> · ${st.tools}`; };
    b.addEventListener('mouseenter', show); b.addEventListener('focus', show);
  });
  let pickerFocus = null;
  function openPicker() {
    if (S.overlay) return;
    pickerFocus = document.activeElement;
    updateNav();
    picker.hidden = false;
    requestAnimationFrame(() => picker.classList.add('in'));
    const cur = nav.querySelector('[aria-pressed="true"]') || nav.querySelector('[data-stage]');
    cur.focus({ preventScroll: true });
  }
  function closePicker() {
    if (picker.hidden) return;
    picker.classList.remove('in'); picker.hidden = true;
    if (pickerFocus && pickerFocus.focus) pickerFocus.focus({ preventScroll: true });
  }
  $('#stageCur').addEventListener('click', openPicker);
  panel.addEventListener('click', e => { if (e.target.closest('#missionPick')) openPicker(); });
  $('#pickLab').addEventListener('click', () => { closePicker(); if (S.mode !== 'lab') loadLab(); });
  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });
  $('#prevBtn').addEventListener('click', () => { if (S.mode === 'stage' && S.stage > 0) loadStage(S.stage - 1); else if (S.mode === 'lab') loadStage(STAGES.length - 1); });
  $('#nextBtn').addEventListener('click', () => { if (S.mode === 'stage') { if (S.stage < STAGES.length - 1) loadStage(S.stage + 1); else loadLab(); } });
  $('#labBtn').addEventListener('click', () => { if (S.mode !== 'lab') loadLab(); });
  function updateNav() {
    nav.querySelectorAll('[data-stage]').forEach(b => {
      const i = +b.dataset.stage;
      b.setAttribute('aria-pressed', String(S.mode === 'stage' && S.stage === i));
      b.classList.toggle('done', cleared.has(STAGES[i].id));
    });
    $('#labBtn').setAttribute('aria-pressed', String(S.mode === 'lab'));
    const n = cleared.size;
    $('#progress').textContent = `${n} / ${STAGES.length} 클리어`;
    $('#pickProg').textContent = `${n} / ${STAGES.length} 클리어`;
    const cur = $('#stageCur');
    if (S.mode === 'stage') {
      const st = stageOf();
      cur.querySelector('.mono').textContent = String(st.id).padStart(2, '0');
      cur.querySelector('.t').textContent = st.title;
      $('#pickFoot').innerHTML = `<b>${st.id}. ${st.title}</b> · ${st.tools}`;
    } else {
      cur.querySelector('.mono').textContent = 'LAB';
      cur.querySelector('.t').textContent = '자유 실험실';
    }
    $('#prevBtn').disabled = S.mode === 'stage' && S.stage === 0;
    $('#nextBtn').disabled = S.mode === 'lab';
  }

  /* 정답 보기 */
  const modal = $('#giveup');
  let lastFocus = null;
  function openModal() {
    if (S.mode !== 'stage') return;
    lastFocus = document.activeElement;
    modal.hidden = false;
    requestAnimationFrame(() => modal.classList.add('in'));
    $('#giveNo').focus({ preventScroll: true });
  }
  function closeModal() {
    modal.classList.remove('in'); modal.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $('#giveNo').addEventListener('click', closeModal);
  $('#giveYes').addEventListener('click', () => { closeModal(); revealSolution(); });
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function revealSolution() {
    const st = stageOf();
    clearTimeout(winTimer);
    S.objs = S.objs.filter(o => o.locked);
    S.inv = { ...st.inventory };
    for (const p of st.solution) {
      const o = newPiece(p.key || p.type);
      Object.assign(o, { x: p.x, y: p.y, rot: normDeg(p.rot) });
      S.objs.push(o);
      S.inv[p.key || p.type]--;
    }
    S.sel = null; S.revealed = true; S.placed = true; S.won = false;
    S.hintStep = st.hints.length;
    renderHints();
    updateInv(); updateCoach(); updateStatus();
    retrace();
  }

  const statusBar = $('#status');
  function updateStatus() {
    const show = S.mode === 'stage' && S.revealed;
    statusBar.hidden = !show;
    if (show) {
      const last = S.stage >= STAGES.length - 1;
      $('#statusNext').hidden = last;
    }
  }
  $('#statusRetry').addEventListener('click', () => loadStage(S.stage));
  $('#statusNext').addEventListener('click', () => loadStage(Math.min(STAGES.length - 1, S.stage + 1)));

  /* 클리어 */
  const clearEl = $('#clear');
  function showClear() {
    const st = stageOf();
    const used = S.objs.filter(o => !o.locked).length;
    const rows = [];
    for (const r of evalRes) {
      if (!r.checks) continue;
      const multi = evalRes.filter(x => x.checks).length > 1;
      for (const k of r.checks) rows.push([multi && !k.label.includes(r.obj.label) ? `${r.obj.label} · ${k.label}` : k.label, k.text]);
    }
    rows.push(['사용한 부품', `${used}개`]);
    $('#clearEyebrow').textContent = `STAGE ${String(st.id).padStart(2, '0')} · 실험 기록`;
    $('#clearTitle').textContent = st.clearTitle || '실험 성공';
    $('#clearStats').innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd class="mono">${v}</dd></div>`).join('');
    const last = S.stage >= STAGES.length - 1;
    $('#clearNext').textContent = last ? '자유 실험실 열기' : `다음 스테이지 ${String(st.id + 1).padStart(2, '0')}`;
    clearEl.hidden = false;
    requestAnimationFrame(() => clearEl.classList.add('in'));
    $('#clearNext').focus({ preventScroll: true });
  }
  function hideClear() { if (!S) return; S.overlay = false; clearEl.classList.remove('in'); clearEl.hidden = true; dirty = true; }
  $('#clearKeep').addEventListener('click', hideClear);
  $('#clearRetry').addEventListener('click', () => { hideClear(); loadStage(S.stage); });
  $('#clearNext').addEventListener('click', () => {
    hideClear();
    if (S.stage >= STAGES.length - 1) loadLab(); else loadStage(S.stage + 1);
  });

  /* ---------- 시작 ---------- */
  function start(data) {
    if (data && data.S && data.S.objs) {
      S = data.S;
      S.objs.forEach(o => { o.hidden = false; });
      S.lab.spectrum = S.lab.spectrum || 'white';
      uid = Math.max(1, ...S.objs.map(o => o.id)) + 1;
      if (S.inv) for (const k in S.inv) if (S.inv[k] === null) S.inv[k] = Infinity;
      S.overlay = false;
      afterLoad();
    } else loadStage(0);
    slot();
    resize();
    const relayout = new ResizeObserver(layoutBoard);
    [appEl, gameEl, colC, dockEl, topEl, $('#selSec')].forEach(el => relayout.observe(el));
    stackedMQ.addEventListener('change', layoutBoard);
    compactMQ.addEventListener('change', () => { slot(); resizeSpec(); updateReadout(); });
    new ResizeObserver(() => { resize(); resizeSpec(); updateReadout(); }).observe(boardWrap);
    new ResizeObserver(() => { resizeSpec(); updateReadout(); }).observe(panel);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildBench(); dirty = true; updateReadout(); });
    requestAnimationFrame(loop);
  }

  window.claude?.hot?.snapshot?.(() => ({
    S: JSON.parse(JSON.stringify({ ...S, inv: Object.fromEntries(Object.entries(S.inv).map(([k, v]) => [k, v === Infinity ? null : v])) })),
  }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();


</script>
</body>
</html>

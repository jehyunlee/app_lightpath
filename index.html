<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<!-- iPhone Safari에는 Fullscreen API가 없다. 홈 화면에 추가하면 전체 화면 앱으로 열리도록 한다 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="물리 실험실">
<title>물리 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>

/* 배치: 한 화면에 다 들어오는 가로 레이아웃 (가로 태블릿 16:9~5:3 기준).
   머리띠(스테이지 이동) / 왼쪽: 광학 정반 + 그 아래 부품 선반 / 오른쪽: 실험 노트(미션·판독, 닫바닥에 선택 부품·버튼).
   정반 크기는 JS(layoutBoard)가 남는 높이·너비에 맞춰 정한다. 세로 화면(폰)에서는 위아래로 쌓고 스크롤한다.
   어두운 암실 하나로만 디자인한 단일 테마. */
:root {
  --page: #0a0c0f;
  --panel: #13171d;
  --line: #252c35;
  --line-2: #323a45;
  --ink: #e3e7ec;
  --muted: #8b95a3;
  --dim: #66707e;
  --tape: #e8d9a0;
  --tape-ink: #2a2619;
  --accent: #f3c447;
  --accent-ink: #1a1606;
  --ok: #74d99f;
  --bad: #ff8a7a;
  --f-hand: "Nanum Pen Script", "Gaegu", "Comic Sans MS", cursive;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--page); color: var(--ink); height: 100%; }
body { margin: 0; font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.small { font-size: 12px; }

.app {
  height: 100dvh; display: flex; flex-direction: column; gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
@supports not (height: 100dvh) { .app { height: 100vh; } }

/* 머리띠: 제목 · ‹ 현재 스테이지 › · 진행 · 자유 실험실 */
.top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 42px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-family: var(--f-hand); font-weight: 400; font-size: 32px; line-height: 1; color: var(--tape); letter-spacing: 0.01em; white-space: nowrap; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1240px) { .brand p { display: none; } }
.modes { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nav-b, .stage-cur, .lab-b { height: 40px; border: 1px solid var(--line); background: #0f1216; border-radius: 6px; cursor: pointer; color: var(--muted); }
.nav-b { width: 40px; flex: none; font-size: 22px; line-height: 1; padding: 0 0 3px; }
.nav-b:disabled { opacity: .3; cursor: default; }
.stage-cur { display: flex; align-items: center; gap: 8px; min-width: 128px; max-width: min(44vw, 420px); padding: 0 10px 0 12px; color: var(--ink); font-size: 14px; font-weight: 500; }
.stage-cur .mono { color: var(--accent); flex: none; font-size: 13px; }
.stage-cur .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-cur::after { content: "▾"; color: var(--muted); flex: none; font-size: 12px; }
.prog { font-size: 12px; color: var(--dim); margin: 0 4px; white-space: nowrap; }
.lab-b { padding: 0 14px; font-size: 13px; font-weight: 500; flex: none; }
.lab-b[aria-pressed="true"] { background: #232a33; color: var(--ink); border-color: var(--line-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.nav-b:hover:not(:disabled), .stage-cur:hover, .lab-b:hover { color: var(--ink); border-color: var(--line-2); }
/* 전체 화면 버튼: 터치 기기에서만 (브라우저 테두리를 숨겨 정반을 크게) */
.fs-b { display: none; width: 40px; height: 40px; flex: none; align-items: center; justify-content: center; border: 1px solid var(--line); background: #0f1216; border-radius: 6px; color: var(--muted); cursor: pointer; padding: 0; }
.fs-b:hover { color: var(--ink); border-color: var(--line-2); }
.fs-b .fs-out { display: none; }
.fs-b[aria-pressed="true"] .fs-in { display: none; }
.fs-b[aria-pressed="true"] .fs-out { display: block; }
@media (pointer: coarse) { .fs-b:not([hidden]) { display: inline-flex; } }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: min(92vw, 520px);
  background: #241f10; color: #f1e3b5; border: 1px solid #5a4a1c; border-radius: 6px; padding: 9px 14px; font-size: 12.5px; text-wrap: pretty; text-align: center;
  box-shadow: 0 12px 30px -12px rgba(0,0,0,.9); }
.pick-h #pickLab { margin-left: auto; }

/* 스테이지 고르기 (창) */
.pick-card { width: min(680px, 100%); }
.pick-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.pick-h h2 { margin: 0; font-size: 17px; }
.pick-grid { display: grid; gap: 8px; }
.st-row { display: grid; grid-template-columns: 40px repeat(10, minmax(0, 1fr)); gap: 6px; align-items: center; }
.st-lab { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--dim); text-align: center; }
.st-b { position: relative; height: 44px; border: 1px solid var(--line); background: #0f1216; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; padding: 0; }
.st-b.done::after { content: ""; position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.st-b[aria-pressed="true"] { background: #232a33; color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.st-b:hover { color: var(--ink); border-color: var(--line-2); }
.pick-foot { margin: 14px 0 0; min-height: 1.4em; color: var(--muted); font-size: 13px; text-wrap: pretty; }
.pick-foot b { color: var(--ink); font-weight: 500; }

.status { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap;
  padding: 8px 12px; background: #241f10; border-bottom: 1px solid #5a4a1c; color: #f1e3b5; font-size: 12.5px; }
.status b { color: var(--accent); }
.status-b { display: flex; gap: 6px; }

/* 본문 */
.game { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; gap: 12px; }
.board-col { flex: 0 0 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.board-wrap {
  position: relative; flex: none; width: 100%; border-radius: 6px; overflow: hidden; background: #12161b;
  box-shadow: 0 0 0 1px #000, 0 0 0 2px #20262e, 0 24px 48px -24px rgba(0,0,0,0.9);
}
#board { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* 세로 화면(폰)에서는 위아래로 쌓고 페이지를 스크롤한다. (가로이면서 낮은 폰 화면은 아래 compact가 맡는다) */
@media (max-aspect-ratio: 1/1), (max-width: 760px) and (min-height: 561px) {
  .app { height: auto; min-height: 100dvh; }
  .game { flex-direction: column; }
  .board-col { flex: none; width: auto !important; }
  .board-wrap { height: auto !important; aspect-ratio: 1000 / 640; }
  .panel { max-width: none !important; min-height: 0; }
  .panel-body { overflow: visible; }
  .top { flex-wrap: wrap; }
  .brand { flex-basis: 100%; }
  .stage-cur { max-width: none; flex: 1 1 auto; }
}
#board:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.board-wrap.dropping-out::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 2px var(--bad); border-radius: 6px;
}
.out-msg {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: #2a1714; color: #ffd5cd; border: 1px solid #5a2a24; padding: 5px 12px; border-radius: 4px;
  font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .15s;
}
.board-wrap.dropping-out .out-msg { opacity: 1; }

/* 마스킹 테이프 라벨 */
.tape {
  display: inline-block; background: var(--tape); color: var(--tape-ink);
  font-family: var(--f-hand); font-size: 22px; line-height: 1; padding: 6px 16px 3px;
  transform: rotate(-1.4deg);
  clip-path: polygon(0 0, 100% 0, 98.5% 25%, 100% 50%, 98.5% 75%, 100% 100%, 0 100%, 1.5% 75%, 0 50%, 1.5% 25%);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.4));
}
.tape-lg { font-size: 27px; padding: 7px 18px 4px; }
.tape-btn { border: 0; cursor: pointer; text-align: left; max-width: 100%; white-space: normal; }
.tape-btn .caret { font-family: var(--f-body); font-size: 14px; margin-left: 10px; opacity: .55; vertical-align: middle; }
.tape-btn:hover .caret, .tape-btn:focus-visible .caret { opacity: 1; }

.coach {
  position: absolute; transform: translate(-6%, -100%); pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
}
.coach span {
  background: var(--tape); color: var(--tape-ink); font-family: var(--f-hand);
  font-size: clamp(15px, 2vw, 21px); line-height: 1; padding: 5px 12px 3px; transform: rotate(-2deg);
  clip-path: polygon(0 0, 100% 0, 98% 30%, 100% 60%, 98% 100%, 0 100%, 2% 70%, 0 35%);
  white-space: nowrap;
}
.coach::after {
  content: ""; width: 2px; height: clamp(10px, 2.2vw, 22px); margin-left: 18px;
  background: linear-gradient(var(--tape), rgba(232,217,160,0));
  animation: bob 1.4s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(4px); } }

/* 실험 노트 패널: 위는 스크롤 영역(미션·판독), 아래는 항상 보이는 닫바닥(선택 부품·버튼) */
.panel { flex: 1 1 340px; min-width: 300px; max-width: 470px; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.panel-foot { flex: none; border-top: 1px solid var(--line); background: #11151a; }
.sec { padding: 14px 16px; border-top: 1px solid var(--line); min-width: 0; }
.panel-body .sec:first-child { border-top: 0; }
.panel-foot .sec { border-top: 0; padding: 10px 14px; }
.panel-foot .sec + .sec { border-top: 1px solid var(--line); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
.sec-h .small, .sec-h .mono { letter-spacing: 0; font-weight: 400; }
.mission .brief { margin: 8px 0 0; color: #cdd3db; text-wrap: pretty; }
.mission .tools { margin: 10px 0 0; font-size: 12.5px; color: var(--ink); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mission .tools span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.mission .brief b { color: var(--ink); font-weight: 700; }

.rds { display: grid; gap: 14px; }
.rd-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.rd-name { font-family: var(--f-hand); font-size: 19px; line-height: 1; color: var(--tape); }
.rd-n { font-size: 11px; }
canvas.spec { display: block; width: 100%; height: 72px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.meters { display: grid; gap: 8px; margin-top: 10px; }
.meter .m-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.meter .m-top b { color: var(--ink); font-weight: 600; }
.m-bar { position: relative; height: 6px; background: #0b0e12; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.m-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bad); border-radius: 3px; transition: width .15s; }
.meter.ok .m-bar i { background: var(--ok); }
.m-bar s { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .7; }
.verdict { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.verdict.ok { color: var(--ok); }

/* 부품 선반: 정반 바로 아래 한 줄. 부품이 많으면 옆으로 밀어 본다 */
.dock { flex: none; min-width: 0; display: flex; align-items: stretch; gap: 10px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.dock-h { flex: none; align-self: center; width: 44px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); line-height: 1.3; }
.dock-h small { display: block; font-weight: 400; letter-spacing: 0; color: var(--dim); font-size: 10.5px; }
.inv { flex: 1 1 auto; min-width: 0; display: flex; gap: 5px; overflow-x: auto; overflow-y: hidden; padding: 1px; scrollbar-width: thin; }
.part {
  position: relative; flex: 1 1 88px; min-width: 70px; max-width: 112px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 4px 5px; background: #0f1317; border: 1px solid var(--line); border-radius: 5px;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.part:hover:not(:disabled) { border-color: #4a5462; background: #141a20; }
.part:active:not(:disabled) { cursor: grabbing; }
.part:disabled { opacity: .35; cursor: default; }
.part img { width: 56px; height: 44px; pointer-events: none; }
.part .pn { font-size: 12px; font-weight: 500; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.part .pf { font-size: 10.5px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
.part .pc { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--accent); }
.part:disabled .pc { color: var(--dim); }

.sel-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.sel-top .mono { font-size: 12px; }
.sel-top #selRet { margin-left: auto; }
.rot-row { display: flex; align-items: center; gap: 6px; }
.rot-row .btn { flex: 1 1 0; padding-inline: 4px; }
.rot-row .ang { flex: 1.2 1 0; text-align: center; font-size: 15px; color: var(--accent); }
.sel-empty { margin: 0; min-height: 2.6em; display: flex; align-items: center; }

.btn {
  background: #1b2128; border: 1px solid var(--line-2); border-radius: 4px; padding: 8px 14px;
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: #56606e; background: #212831; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #ffd469; border-color: #ffd469; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 auto; }
#hintBox { display: grid; gap: 8px; margin-top: 12px; }
#hintBox:empty { display: none; }

/* 손가락으로 누르는 화면: 버튼을 더 크게 */
@media (pointer: coarse) {
  .btn { min-height: 42px; }
  .btn.sm { min-height: 40px; }
  .seg-b { padding-block: 9px; }
}
.hint { margin: 0; display: flex; gap: 10px; font-size: 13px; color: #cdd3db; text-wrap: pretty; }
.hint .mono { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--tape); color: var(--tape-ink);
  font-size: 11px; font-weight: 600; display: grid; place-items: center; margin-top: 1px; }

.ctrl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 14px; }   /* 슬라이더의 고유 폭이 칸을 밀어내지 않게 */
.seg { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 5px; background: #0f1216; }
.seg-b { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 3px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg-b[aria-pressed="true"] { background: #232a33; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.slider { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.slider input { flex: 1 1 0; width: 0; min-width: 0; accent-color: var(--accent); }
.slider .mono { width: 52px; text-align: right; color: var(--muted); }
.slider .lab-s { color: var(--muted); width: 48px; flex: none; }
.sw { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }

.phys { color: var(--muted); font-size: 12.5px; }
.phys summary { cursor: pointer; color: var(--ink); font-size: 13px; font-weight: 500; }
.phys ul { margin: 10px 0; padding-left: 18px; display: grid; gap: 3px; }
.phys b { color: #cdd3db; font-weight: 500; margin-right: 6px; }
.phys p { margin: 8px 0 0; text-wrap: pretty; }

/* 클리어 */
.clear { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: rgba(5,7,9,0.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; transition: opacity .25s; }
.clear.in { opacity: 1; }
.clear-card { position: relative; width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line-2);
  border-radius: 6px; padding: 22px 22px 18px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.9); }
.stamp {
  position: absolute; right: 18px; top: -18px; transform: rotate(8deg);
  font-family: var(--f-mono); font-weight: 600; font-size: 20px; letter-spacing: .18em; color: var(--accent);
  border: 2px solid var(--accent); padding: 4px 10px 4px 14px; border-radius: 3px; background: var(--panel);
  box-shadow: inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--accent);
}
.clear.in .stamp { animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: rotate(8deg) scale(1.8); opacity: 0; } to { transform: rotate(8deg) scale(1); opacity: 1; } }
.eyebrow { margin: 0; font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.clear-card h2 { margin: 6px 0 14px; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0 0 18px; }
.stats dt { overflow-wrap: anywhere; }
.stats div { border-top: 1px solid var(--line); padding-top: 8px; }
.stats dt { font-size: 11.5px; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-size: 16px; color: var(--ink); }
.clear-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
@media (max-width: 520px) { .brand h1 { font-size: 36px; } .clear-card { padding: 18px 16px 14px; } .clear-card h2 { font-size: 19px; } .stats { margin-bottom: 14px; } }

/* 확인 창 */
.modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: auto;
  -webkit-overflow-scrolling: touch; will-change: transform; isolation: isolate;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(4,6,8,0.7); opacity: 0; transition: opacity .18s; }
.modal.in { opacity: 1; }

<script>

/* ===== 광학 엔진: 2D 기하광학 광선 추적 =====
   좌표: 월드 1 단위 = 1 mm, y는 아래쪽이 +.
   모든 부품은 국소 좌표의 기본 도형(선분, 원호)으로 정의되고 회전·이동 후 추적된다. */
const OPT = (() => {
  const W = 1000, H = 640;

  // 코시 분산식 n(λ) = A + B/λ²  (λ: µm)
  // flint: 게임용으로 분산을 과장한 유리 (n 400nm = 1.67, 700nm = 1.50)
  // crown: 실제 크라운 유리에 가까운 저분산 유리 (렌즈용)
  const MAT = {
    flint: { A: 1.4176, B: 0.04039 },
    crown: { A: 1.5046, B: 0.0042 },
  };
  const nOf = (mat, nm) => { const l = nm / 1000; return mat.A + mat.B / (l * l); };

  const LENS_N = nOf(MAT.crown, 550);

  // ---- 부품 카탈로그 (국소 좌표) ----
  // 기본 도형: {k:'s', ax,ay,bx,by, nx,ny, role} / {k:'a', cx,cy,r,a0,span, ns, role}
  // role: glass(바깥쪽 법선) · mirror(반사면 법선) · sensor(감지면 법선) · absorb
  function segPoly(pts, role, out) {
    // 다각형 꼭짓점 → 바깥 법선을 가진 선분
    let gx = 0, gy = 0; pts.forEach(p => { gx += p[0]; gy += p[1]; }); gx /= pts.length; gy /= pts.length;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      let nx = b[1] - a[1], ny = -(b[0] - a[0]);
      const L = Math.hypot(nx, ny); nx /= L; ny /= L;
      const mx = (a[0] + b[0]) / 2 - gx, my = (a[1] + b[1]) / 2 - gy;
      if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
      out.push({ k: 's', ax: a[0], ay: a[1], bx: b[0], by: b[1], nx, ny, role });
    }
  }
  const rect = (x0, y0, x1, y1, role, out) => segPoly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], role, out);

  function lensGeom(f, h) {
    const R = 2 * Math.abs(f) * (LENS_N - 1);
    const sag = R - Math.sqrt(R * R - h * h);
    const phi = Math.asin(h / R);
    return { R, sag, phi };
  }

  const PARTS = {
    prism: {
      name: '프리즘', short: '프리즘', radius: 64,
      defaults: { side: 100 },
      build(p) {
        const s = p.side, a = s / Math.sqrt(3);
        const out = []; segPoly([[0, -a], [s / 2, a / 2], [-s / 2, a / 2]], 'glass', out);
        return { prims: out, mat: MAT.flint, box: [-s / 2, -a, s / 2, a / 2] };
      },
    },
    lensConvex: {
      name: '볼록렌즈', short: '볼록렌즈', radius: 58,
      defaults: { f: 140, h: 48 },
      build(p) {
        const { R, sag, phi } = lensGeom(p.f, p.h), e = 3, t = 2 * sag + e;
        const out = [
          { k: 'a', cx: t / 2 - R, cy: 0, r: R, a0: -phi, span: 2 * phi, ns: 1, role: 'glass' },
          { k: 'a', cx: R - t / 2, cy: 0, r: R, a0: Math.PI - phi, span: 2 * phi, ns: 1, role: 'glass' },
          { k: 's', ax: -e / 2, ay: -p.h, bx: e / 2, by: -p.h, nx: 0, ny: -1, role: 'glass' },
          { k: 's', ax: -e / 2, ay: p.h, bx: e / 2, by: p.h, nx: 0, ny: 1, role: 'glass' },
        ];
        return { prims: out, mat: MAT.crown, box: [-t / 2, -p.h, t / 2, p.h], geo: { R, sag, t, e } };
      },
    },
    lensConcave: {
      name: '오목렌즈', short: '오목렌즈', radius: 58,
      defaults: { f: -140, h: 48 },
      build(p) {
        const { R, sag, phi } = lensGeom(p.f, p.h), c0 = 4, ex = c0 / 2 + sag;
        const out = [
          { k: 'a', cx: c0 / 2 + R, cy: 0, r: R, a0: Math.PI - phi, span: 2 * phi, ns: -1, role: 'glass' },
          { k: 'a', cx: -c0 / 2 - R, cy: 0, r: R, a0: -phi, span: 2 * phi, ns: -1, role: 'glass' },
          { k: 's', ax: -ex, ay: -p.h, bx: ex, by: -p.h, nx: 0, ny: -1, role: 'glass' },
          { k: 's', ax: -ex, ay: p.h, bx: ex, by: p.h, nx: 0, ny: 1, role: 'glass' },
        ];
        return { prims: out, mat: MAT.crown, box: [-ex, -p.h, ex, p.h], geo: { R, sag, c0 } };
      },
    },
    mirror: {
      name: '평면거울', short: '평면거울', radius: 56,
      defaults: { h: 50 },
      build(p) {
        return { prims: [{ k: 's', ax: 0, ay: -p.h, bx: 0, by: p.h, nx: -1, ny: 0, role: 'mirror' }], box: [-4, -p.h, 8, p.h] };
      },
    },
    mirrorConcave: {
      name: '오목거울', short: '오목거울', radius: 56,
      defaults: { f: 140, h: 50 },
      build(p) {
        const R = 2 * p.f, phi = Math.asin(p.h / R);
        return { prims: [{ k: 'a', cx: -R, cy: 0, r: R, a0: -phi, span: 2 * phi, ns: -1, role: 'mirror' }], box: [-8, -p.h, 10, p.h], geo: { R, phi } };
      },
    },
    mirrorConvex: {
      name: '볼록거울', short: '볼록거울', radius: 56,
      defaults: { f: 140, h: 50 },
      build(p) {
        const R = 2 * p.f, phi = Math.asin(p.h / R);
        return { prims: [{ k: 'a', cx: R, cy: 0, r: R, a0: Math.PI - phi, span: 2 * phi, ns: 1, role: 'mirror' }], box: [-6, -p.h, 12, p.h], geo: { R, phi } };
      },
    },
    slit: {
      name: '슬릿', short: '슬릿', radius: 70,
      defaults: { len: 130, gap: 22, th: 6 },
      build(p) {
        const out = [], hl = p.len / 2, hg = p.gap / 2, ht = p.th / 2;
        rect(-ht, -hl, ht, -hg, 'absorb', out);
        rect(-ht, hg, ht, hl, 'absorb', out);
        return { prims: out, box: [-ht, -hl, ht, hl] };
      },
    },
    prismRight: {
      name: '직각 프리즘', short: '직각프리즘', radius: 58,
      defaults: { side: 90 },
      build(p) {
        const h = p.side / 2;
        const out = []; segPoly([[-h, -h], [h, h], [-h, h]], 'glass', out);
        return { prims: out, mat: MAT.flint, box: [-h, -h, h, h] };
      },
    },
    splitter: {
      name: '빔스플리터', short: '빔스플리터', radius: 50,
      defaults: { h: 50, r: 0.5 },
      build(p) {
        return { prims: [{ k: 's', ax: 0, ay: -p.h, bx: 0, by: p.h, nx: -1, ny: 0, role: 'splitter' }], refl: p.r, box: [-4, -p.h, 8, p.h] };
      },
    },
    filter: {
      name: '색 필터', short: '색필터', radius: 55,
      defaults: { h: 45, th: 8, min: 450, max: 495, excl: false },
      build(p) {
        const out = []; rect(-p.th / 2, -p.h, p.th / 2, p.h, 'filter', out);
        return { prims: out, band: [p.min, p.max], excl: !!p.excl, box: [-p.th / 2, -p.h, p.th / 2, p.h] };
      },
    },
    // ---- 고정 장치 ----
    source: {
      name: '광원', radius: 40,
      defaults: { spectrum: 'white', lambda: 470, width: 0, rays: 1 },
      build() {
        const out = []; rect(-50, -17, 0, 17, 'absorb', out);
        return { prims: out, box: [-50, -17, 0, 17] };
      },
    },
    sensor: {
      name: '센서', radius: 50,
      defaults: { len: 80 },
      build(p) {
        const hl = p.len / 2, out = [{ k: 's', ax: 0, ay: -hl, bx: 0, by: hl, nx: -1, ny: 0, role: 'sensor' }];
        out.push({ k: 's', ax: 0, ay: -hl, bx: 20, by: -hl, nx: 0, ny: -1, role: 'absorb' });
        out.push({ k: 's', ax: 20, ay: -hl, bx: 20, by: hl, nx: 1, ny: 0, role: 'absorb' });
        out.push({ k: 's', ax: 20, ay: hl, bx: 0, by: hl, nx: 0, ny: 1, role: 'absorb' });
        return { prims: out, box: [0, -hl, 20, hl] };
      },
    },
    wall: {
      name: '차광벽', radius: 0,
      defaults: { w: 100, h: 20 },
      build(p) {
        const out = []; rect(-p.w / 2, -p.h / 2, p.w / 2, p.h / 2, 'absorb', out);
        return { prims: out, box: [-p.w / 2, -p.h / 2, p.w / 2, p.h / 2] };
      },
    },
    // ---- 역학 장치 (빛은 막고, 구슬과 충돌한다) ----
    plank: {
      name: '판자', short: '판자', radius: 70,
      defaults: { len: 140, th: 8 },
      build(p) {
        const out = []; rect(-p.len / 2, -p.th / 2, p.len / 2, p.th / 2, 'absorb', out);
        return { prims: out, box: [-p.len / 2, -p.th / 2, p.len / 2, p.th / 2] };
      },
    },
    paper: {
      // 윗면·아랫면은 받은 빛을 기록하는 'paper' 역할. spot(mm) 안에 need 비율 이상의 빛이 모이면 탄다.
      // reflect: [min,max] 대역은 종이 색이라 반사되어 가열에 보태지 않는다.
      name: '종이', radius: 0,
      defaults: { w: 90, th: 3, spot: 14, need: 0.8, reflect: null },
      build(p) {
        const hw = p.w / 2, ht = p.th / 2;
        const out = [
          { k: 's', ax: -hw, ay: -ht, bx: hw, by: -ht, nx: 0, ny: -1, role: 'paper' },
          { k: 's', ax: -hw, ay: ht, bx: hw, by: ht, nx: 0, ny: 1, role: 'paper' },
          { k: 's', ax: -hw, ay: -ht, bx: -hw, by: ht, nx: -1, ny: 0, role: 'absorb' },
          { k: 's', ax: hw, ay: -ht, bx: hw, by: ht, nx: 1, ny: 0, role: 'absorb' },
        ];
        return { prims: out, box: [-hw, -ht, hw, ht] };
      },
    },
    ball: {
      // 쇠구슬은 빛을 막는다 (불투명 원)
      name: '쇠구슬', radius: 0,
      defaults: { r: 9, m: 1 },
      build(p) { return { prims: [{ k: 'a', cx: 0, cy: 0, r: p.r, a0: 0, span: Math.PI * 2, ns: 1, role: 'absorb' }], box: [-p.r, -p.r, p.r, p.r] }; },
    },
    loadcell: {
      name: '로드셀', radius: 0,
      defaults: { w: 70, h: 12 },
      build(p) {
        const out = []; rect(-p.w / 2, -p.h / 2, p.w / 2, p.h / 2, 'absorb', out);
        return { prims: out, box: [-p.w / 2, -p.h / 2, p.w / 2, p.h / 2] };
      },
    },
    pendulum: {
      // (x,y)는 축. L 길이의 줄 끝에 반지름 r, 질량 m의 추. a0: 초기 각도(°, 0 = 아래로 늘어짐)
      name: '진자', radius: 0,
      defaults: { L: 120, r: 12, m: 1, a0: 0 },
      build(p) { return { prims: [], box: [-p.L - p.r, -p.r, p.L + p.r, p.L + p.r] }; },
    },
    lever: {
      // (x,y)는 받침점(축). 왼팔 l1, 오른팔 l2 길이의 막대가 구슬의 무게로 기울어진다. rot이 현재 기울기(°, +는 오른팔이 내려감).
      // amin/amax: 축의 멈춤쇠(°). m: 막대 질량(쇠구슬 1 기준). 막대는 빛을 막는다.
      name: '지레', radius: 0,
      defaults: { l1: 100, l2: 100, th: 8, m: 1, amin: -30, amax: 30 },
      build(p) {
        const out = []; rect(-p.l1, -p.th / 2, p.l2, p.th / 2, 'absorb', out);
        return { prims: out, box: [-p.l1, -p.th / 2, p.l2, p.th / 2] };
      },
    },
    slide: {
      // (x,y)는 원호의 중심. 반지름 R인 안쪽 면을 구슬이 타고 달린다. a0 → a1 (°, 0 = +x, 90 = 아래). 띄 두께 w.
      name: '슬라이드', radius: 0,
      defaults: { R: 120, w: 10, a0: 180, a1: 60 },
      build(p) {
        const out = [], n = Math.max(4, Math.ceil(Math.abs(p.a1 - p.a0) / 6)), d = Math.PI / 180;
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (let i = 0; i < n; i++) {
          const fa = (p.a0 + (p.a1 - p.a0) * i / n) * d, fb = (p.a0 + (p.a1 - p.a0) * (i + 1) / n) * d;
          const q = [[p.R * Math.cos(fa), p.R * Math.sin(fa)], [p.R * Math.cos(fb), p.R * Math.sin(fb)], [(p.R + p.w) * Math.cos(fb), (p.R + p.w) * Math.sin(fb)], [(p.R + p.w) * Math.cos(fa), (p.R + p.w) * Math.sin(fa)]];
          segPoly(q, 'absorb', out);
          for (const [x, y] of q) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
        }
        return { prims: out, box: [x0, y0, x1, y1] };
      },
    },
  };

  // 부품 하나의 월드 좌표 기본 도형
  function worldPrims(obj) {
    const def = PARTS[obj.type];
    const params = Object.assign({}, def.defaults, obj.params || {});
    const g = def.build(params);
    const th = obj.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
    const tx = (x, y) => [obj.x + x * c - y * s, obj.y + x * s + y * c];
    const prims = g.prims.map(p => {
      if (p.k === 's') {
        const [ax, ay] = tx(p.ax, p.ay), [bx, by] = tx(p.bx, p.by);
        return { k: 's', ax, ay, bx, by, nx: p.nx * c - p.ny * s, ny: p.nx * s + p.ny * c, role: p.role, obj, mat: g.mat, band: g.band, excl: g.excl, refl: g.refl };
      }
      const [cx, cy] = tx(p.cx, p.cy);
      return { k: 'a', cx, cy, r: p.r, a0: p.a0 + th, span: p.span, ns: p.ns, role: p.role, obj, mat: g.mat, band: g.band, excl: g.excl, refl: g.refl };
    });
    return { prims, geom: g, params };
  }

  const TAU = Math.PI * 2;
  const EPS = 1e-6;

  function nearestHit(prims, px, py, dx, dy) {
    let best = Infinity, hit = null;
    for (let i = 0; i < prims.length; i++) {
      const p = prims[i];
      if (p.k === 's') {
        const ex = p.bx - p.ax, ey = p.by - p.ay;
        const den = dx * ey - dy * ex;
        if (Math.abs(den) < 1e-12) continue;
        const wx = p.ax - px, wy = p.ay - py;
        const t = (wx * ey - wy * ex) / den;
        const u = (wx * dy - wy * dx) / den;
        if (t > EPS && t < best && u >= -1e-9 && u <= 1 + 1e-9) { best = t; hit = { p, t, nx: p.nx, ny: p.ny }; }
      } else {
        const ox = px - p.cx, oy = py - p.cy;
        const b = ox * dx + oy * dy, cc = ox * ox + oy * oy - p.r * p.r;
        const disc = b * b - cc;
        if (disc < 0) continue;
        const sq = Math.sqrt(disc);
        for (const t of [-b - sq, -b + sq]) {
          if (t <= EPS || t >= best) continue;
          const qx = ox + dx * t, qy = oy + dy * t;
          let ang = Math.atan2(qy, qx) - p.a0;
          ang = ((ang % TAU) + TAU) % TAU;
          if (ang <= p.span + 1e-9) {
            best = t;
            hit = { p, t, nx: p.ns * qx / p.r, ny: p.ns * qy / p.r };
          }
        }
      }
    }
    return hit;
  }

  function boardExit(px, py, dx, dy) {
    let t = Infinity;
    if (dx > 1e-12) t = Math.min(t, (W - px) / dx); else if (dx < -1e-12) t = Math.min(t, -px / dx);
    if (dy > 1e-12) t = Math.min(t, (H - py) / dy); else if (dy < -1e-12) t = Math.min(t, -py / dy);
    return Math.max(0, t === Infinity ? 0 : t);
  }

  // 백색광 표본 파장
  function spectrumOf(src) {
    const p = src.params || {};
    const spec = p.spectrum || 'white';
    if (spec === 'mono') return [p.lambda || 550];
    if (Array.isArray(spec)) return spec;
    const step = (p.rays || 1) > 1 ? 10 : 5;
    const out = []; for (let l = 400; l <= 700; l += step) out.push(l);
    return out;
  }

  /* 장면 추적.
     objs: [{type,x,y,rot,params,hidden}] (광원 포함)
     반환: { paths:[{lambda,I,pts,end}], sensorHits: Map(sensorObj → [{lambda,I,u}]), emitted: Map(src → [lambda]) } */
  function trace(objs) {
    const prims = [];
    const sources = [];
    for (const o of objs) {
      if (o.hidden || o.burnt) continue;
      const wp = worldPrims(o);
      for (const p of wp.prims) prims.push(p);
      if (o.type === 'source') sources.push({ o, params: wp.params });
    }
    const paths = [], sensorHits = new Map(), emitted = [];
    sources.forEach(({ o, params }, si) => {
      const th = o.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
      const lambdas = spectrumOf(o);
      const n = Math.max(1, params.rays | 0), w = params.width || 0;
      for (let i = 0; i < n; i++) {
        const t = n > 1 ? i / (n - 1) - 0.5 : 0;
        // fan > 0: 한 점에서 부채꼴로 퍼지는 점광원, 아니면 폭 w의 평행광
        const fan = (params.fan || 0) * Math.PI / 180;
        const off = fan ? 0 : t * w;
        const a = th + t * fan, rc = Math.cos(a), rs = Math.sin(a);
        const ox = o.x + 0.5 * c - off * s, oy = o.y + 0.5 * s + off * c;
        lambdas.forEach((lam, li) => {
          emitted.push(lam);
          const subs = traceRay(prims, ox, oy, rc, rs, lam, 1, sensorHits);
          subs.forEach(path => {
            path.si = si; path.oi = i; path.li = li; path.nO = n; path.nL = lambdas.length;
            paths.push(path);
          });
        });
      }
    });
    return { paths, sensorHits, emitted };
  }

  // splitter(빔스플리터)는 절제 지점에서 반사/투과 두 갈래로 갈라져서
  // 여러 경로를 만들 수 있다. 각 경로는 별도의 파특(path) 객체로 반환된다.
  function traceRay(prims, px, py, dx, dy, lam, I, sensorHits, depth, branch, pts0, tags0) {
    depth = depth || 0; branch = branch || '';
    const pts = pts0 ? pts0.slice() : [px, py];
    const tags = tags0 ? tags0.slice() : [null];
    let end = { type: 'edge' };
    for (let bounce = 0; bounce < 80; bounce++) {
      const hit = nearestHit(prims, px, py, dx, dy);
      if (!hit) {
        const t = boardExit(px, py, dx, dy);
        const ex = px + dx * t, ey = py + dy * t;
        pts.push(ex, ey);
        tags.push(ex < 0.01 ? 'L' : ex > W - 0.01 ? 'R' : ey < 0.01 ? 'T' : 'B');
        end = { type: 'edge' };
        return [{ lambda: lam, I, pts, tags, end, bi: branch }];
      }
      const qx = px + dx * hit.t, qy = py + dy * hit.t;
      pts.push(qx, qy); tags.push(hit.p);
      const role = hit.p.role;
      const dn = dx * hit.nx + dy * hit.ny;
      if (role === 'absorb') { end = { type: 'absorb', x: qx, y: qy }; return [{ lambda: lam, I, pts, tags, end, bi: branch }]; }
      if (role === 'sensor') {
        if (dn < 0) {
          const s = hit.p, ex = s.bx - s.ax, ey = s.by - s.ay;
          const u = ((qx - s.ax) * ex + (qy - s.ay) * ey) / (ex * ex + ey * ey);
          if (!sensorHits.has(s.obj)) sensorHits.set(s.obj, []);
          sensorHits.get(s.obj).push({ lambda: lam, I, u, dx, dy });
          end = { type: 'sensor', x: qx, y: qy, obj: s.obj };
        } else end = { type: 'absorb', x: qx, y: qy };
        return [{ lambda: lam, I, pts, tags, end, bi: branch }];
      }
      if (role === 'paper') {
        // 종이는 빛을 흡수하면서 어디에 얼마나 받았는지 기록한다 (집광 판정용)
        const s = hit.p, ex = s.bx - s.ax, ey = s.by - s.ay;
        const u = ((qx - s.ax) * ex + (qy - s.ay) * ey) / (ex * ex + ey * ey);
        if (!sensorHits.has(s.obj)) sensorHits.set(s.obj, []);
        sensorHits.get(s.obj).push({ lambda: lam, I, u, dx, dy });
        end = { type: 'absorb', x: qx, y: qy };
        return [{ lambda: lam, I, pts, tags, end, bi: branch }];
      }
      if (role === 'filter') {
        const band = hit.p.band || [400, 700];
        const inBand = lam >= band[0] && lam <= band[1];
        const blocked = hit.p.excl ? inBand : !inBand;
        if (blocked) { end = { type: 'absorb', x: qx, y: qy }; return [{ lambda: lam, I, pts, tags, end, bi: branch }]; }
        // 대역 안: 굴절 없이 그대로 통과한다
      } else if (role === 'mirror') {
        if (dn >= 0) { end = { type: 'absorb', x: qx, y: qy }; return [{ lambda: lam, I, pts, tags, end, bi: branch }]; }
        dx -= 2 * dn * hit.nx; dy -= 2 * dn * hit.ny;
      } else if (role === 'splitter') {
        if (dn >= 0) { end = { type: 'absorb', x: qx, y: qy }; return [{ lambda: lam, I, pts, tags, end, bi: branch }]; }
        if (depth >= 3) {
          // 분기 한도 초과: 투과만 시켜 무한분기를 막는다 (방향 변화 없음)
        } else {
          const refl = hit.p.refl != null ? hit.p.refl : 0.5;
          const rdx = dx - 2 * dn * hit.nx, rdy = dy - 2 * dn * hit.ny;
          const rL = Math.hypot(rdx, rdy), rux = rdx / rL, ruy = rdy / rL;
          const tL = Math.hypot(dx, dy), tux = dx / tL, tuy = dy / tL;
          const branches = [];
          if (refl > 1e-6) branches.push(...traceRay(prims, qx + rux * 1e-3, qy + ruy * 1e-3, rux, ruy, lam, I * refl, sensorHits, depth + 1, branch + 'R', pts, tags));
          if (refl < 1 - 1e-6) branches.push(...traceRay(prims, qx + tux * 1e-3, qy + tuy * 1e-3, tux, tuy, lam, I * (1 - refl), sensorHits, depth + 1, branch + 'T', pts, tags));
          return branches;
        }
      } else if (role === 'glass') {
        const ng = nOf(hit.p.mat, lam);
        let fx = hit.nx, fy = hit.ny, n1, n2;
        if (dn < 0) { n1 = 1; n2 = ng; } else { n1 = ng; n2 = 1; fx = -fx; fy = -fy; }
        const eta = n1 / n2;
        const cosi = -(dx * fx + dy * fy);
        const k = 1 - eta * eta * (1 - cosi * cosi);
        if (k < 0) { // 전반사
          dx += 2 * cosi * fx; dy += 2 * cosi * fy;
        } else {
          const a = eta * cosi - Math.sqrt(k);
          dx = eta * dx + a * fx; dy = eta * dy + a * fy;
        }
      }
      const L = Math.hypot(dx, dy); dx /= L; dy /= L;
      px = qx + dx * 1e-3; py = qy + dy * 1e-3;
    }
    return [{ lambda: lam, I, pts, tags, end, bi: branch }];
  }

  // 파장 → 색 (sRGB 근사)
  function wlRGB(l) {
    let r = 0, g = 0, b = 0;
    if (l < 440) { r = -(l - 440) / 60; b = 1; }
    else if (l < 490) { g = (l - 440) / 50; b = 1; }
    else if (l < 510) { g = 1; b = -(l - 510) / 20; }
    else if (l < 580) { r = (l - 510) / 70; g = 1; }
    else if (l < 645) { r = 1; g = -(l - 645) / 65; }
    else r = 1;
    let f = 1;
    if (l < 420) f = 0.35 + 0.65 * (l - 380) / 40;
    else if (l > 680) f = 0.35 + 0.65 * (750 - l) / 70;
    const gm = 0.8;
    return [Math.round(255 * Math.pow(r * f, gm)), Math.round(255 * Math.pow(g * f, gm)), Math.round(255 * Math.pow(b * f, gm))];
  }

  const BANDS = [
    { name: '보라', min: 400, max: 445 },
    { name: '파랑', min: 450, max: 495 },
    { name: '초록', min: 500, max: 565 },
    { name: '노랑', min: 570, max: 590 },
    { name: '주황', min: 595, max: 620 },
    { name: '빨강', min: 625, max: 700 },
  ];
  const bandName = l => (BANDS.find(b => l >= b.min && l <= b.max) || { name: '' }).name;

  return { W, H, MAT, PARTS, nOf, worldPrims, trace, wlRGB, BANDS, bandName, spectrumOf };
})();

<script>

/* ===== 스테이지와 판정 ===== */
const GAME = (() => {
  const BANDS = OPT.BANDS;

  /* 센서 하나의 목표를 판정한다.
     checks: band(대역 세기) · purity(순도) · power(전체 빛 중 도달 비율)
             coverage(센서 길이 중 비친 범위) · parallel(광선 사이 최대 각도 차) · white(여섯 색 모두) */
  function evalGoal(goal, hits, emitted) {
    const total = hits.reduce((s, h) => s + h.I, 0);
    const inB = (l, b) => l >= b[0] && l <= b[1];
    const bandStrength = b => {
      const e = emitted.filter(l => inB(l, b)).length;
      return e ? hits.filter(h => inB(h.lambda, b)).reduce((s, h) => s + h.I, 0) / e : 0;
    };
    const out = [];
    for (const c of goal.checks) {
      let v = 0, ok = false, r;
      switch (c.kind) {
        case 'band':
          v = bandStrength(c.band); ok = v >= c.min;
          r = { label: `${c.name} 세기`, frac: v, need: c.min, text: pct(v), needText: `기준 ${pct(c.min)}` };
          break;
        case 'band_max':
          v = bandStrength(c.band); ok = v <= c.max;
          r = { label: `${c.name} 차단`, frac: 1 - v, need: 1 - c.max, text: pct(v), needText: `기준 ≤ ${pct(c.max)}` };
          break;
        case 'purity': {
          v = total ? hits.filter(h => inB(h.lambda, c.band)).reduce((s, h) => s + h.I, 0) / total : 0;
          ok = total > 0 && v >= c.min;
          r = { label: `${c.name} 순도`, frac: v, need: c.min, text: pct(v), needText: `기준 ${pct(c.min)}` };
          break;
        }
        case 'power':
          v = emitted.length ? total / emitted.length : 0; ok = v >= c.min - 1e-9;
          r = { label: c.label || '도달한 빛', frac: v, need: c.min, text: pct(v), needText: `기준 ${pct(c.min)}` };
          break;
        case 'coverage': {
          if (hits.length > 1) { const us = hits.map(h => h.u); v = Math.max(...us) - Math.min(...us); }
          ok = v >= c.min;
          r = { label: '센서를 비춘 범위', frac: v, need: c.min, text: pct(v), needText: `기준 ${pct(c.min)}` };
          break;
        }
        case 'parallel': {
          let spread = Infinity;
          if (hits.length > 1) {
            const as = hits.map(h => Math.atan2(h.dy, h.dx));
            const m = as[0];
            const rel = as.map(a => { let d = a - m; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; });
            spread = (Math.max(...rel) - Math.min(...rel)) * 180 / Math.PI;
          }
          ok = spread <= c.max;
          // 막대: 기준의 3배 각도를 0, 0°를 가득으로 본다
          const f = spread === Infinity ? 0 : Math.max(0, 1 - spread / (3 * c.max));
          r = { label: '광선 평행도', frac: f, need: 2 / 3, text: spread === Infinity ? '—' : `${spread.toFixed(1)}°`, needText: `기준 ≤ ${c.max.toFixed(1)}°` };
          v = spread;
          break;
        }
        case 'white': {
          const each = BANDS.map(b => bandStrength([b.min, b.max]));
          v = Math.min(...each); ok = v >= c.min;
          const weakest = BANDS[each.indexOf(v)].name;
          r = { label: `여섯 색 모두 (가장 약한 색: ${weakest})`, frac: v, need: c.min, text: pct(v), needText: `기준 ${pct(c.min)}` };
          break;
        }
      }
      r.ok = ok; r.kind = c.kind; r.value = v;
      out.push(r);
    }
    return { checks: out, ok: out.every(x => x.ok), total };
  }
  const pct = v => `${Math.round(v * 100)}%`;

  /* 종이의 집광 판정: 종이 위 spot(mm) 폭 안에 모인 빛이 전체 방출광의 need 비율 이상이면 탄다.
     종이 색(reflect 대역)과 같은 빛은 반사되어 가열에 보태지 않는다. */
  function paperHeat(paper, hits, emitted) {
    const p = Object.assign({}, OPT.PARTS.paper.defaults, paper.params || {});
    const rb = p.reflect;
    const useful = hits.filter(h => !rb || h.lambda < rb[0] || h.lambda > rb[1]).sort((a, b) => a.u - b.u);
    const win = p.spot / p.w;
    let best = 0, sum = 0, j = 0;
    for (let i = 0; i < useful.length; i++) {
      sum += useful[i].I;
      while (useful[i].u - useful[j].u > win) { sum -= useful[j].I; j++; }
      best = Math.max(best, sum);
    }
    const v = emitted.length ? best / emitted.length : 0;
    const ok = v >= p.need - 1e-9;
    const check = { label: '집광 세기', frac: v, need: p.need, text: pct(v), needText: `기준 ${pct(p.need)}`, ok, kind: 'burn', value: v };
    return { checks: [check], ok, reflected: rb ? hits.length - useful.length : 0 };
  }

  /* 로드셀 판정. hit: MECH 시뮬레이션이 기록한 첫 접촉 { t, speed, by } 또는 null
     checks: touch(닿기만 하면 됨) · impact(충돌 속도 min/max, mm/s) */
  function evalCell(goal, hit) {
    const out = [];
    for (const c of goal.checks) {
      let r;
      if (c.kind === 'touch') {
        r = { label: '로드셀 접촉', frac: hit ? 1 : 0, need: 1, text: hit ? `${hit.t.toFixed(2)} s` : '없음', needText: '접촉', ok: !!hit, value: hit ? hit.t : 0 };
      } else if (c.kind === 'impact') {
        const v = hit ? hit.speed : 0;
        if (c.max != null) {
          const ok = !!hit && v <= c.max;
          r = { label: '충돌 속도', frac: hit ? Math.max(0, 1 - v / (2 * c.max)) : 0, need: 0.5, text: hit ? `${Math.round(v)} mm/s` : '—', needText: `기준 ≤ ${c.max} mm/s`, ok, value: v };
        } else {
          const ok = v >= c.min;
          r = { label: '충돌 속도', frac: Math.min(1, v / (1.5 * c.min)), need: 1 / 1.5, text: hit ? `${Math.round(v)} mm/s` : '—', needText: `기준 ${c.min} mm/s`, ok, value: v };
        }
      }
      r.kind = c.kind;
      out.push(r);
    }
    return { checks: out, ok: out.every(x => x.ok) };
  }

  const W45 = Math.SQRT1_2;
  const DEG = Math.PI / 180;

  // 빛의 진행 방향 dir(°)에 수직인 차광벽 두 장 사이로 폭 gap의 바늘구멍을 만든다
  function pinhole(px, py, dir, gap, half = 110, th = 12) {
    const a = (dir + 90) * DEG, ux = Math.cos(a), uy = Math.sin(a), off = gap / 2 + half / 2;
    return [
      { type: 'wall', x: px + ux * off, y: py + uy * off, rot: dir + 90, params: { w: half, h: th } },
      { type: 'wall', x: px - ux * off, y: py - uy * off, rot: dir + 90, params: { w: half, h: th } },
    ];
  }
  // (px,py)에서 dir 방향으로 dist만큼 뒤에, 빛을 마주 보는 센서
  function behind(px, py, dir, dist, len, label, goal) {
    return { type: 'sensor', x: px + Math.cos(dir * DEG) * dist, y: py + Math.sin(dir * DEG) * dist, rot: dir, params: { len }, label, goal };

     checks: struck(구슬이 추를 쳐야 함) · swing(최대 진폭 min° 이상) */
  function evalPend(goal, q) {

      if (c.kind === 'struck') {

        const v = q ? q.maxSwing : 0, ok = v >= c.min;

      }
      r.kind = c.kind;
      out.push(r);
    }
    return { checks: out, ok: out.every(x => x.ok) };
  }

  return { STAGES, evalGoal, paperHeat, evalCell, evalPend, pinhole, behind };

<script>

/* ===== 역학: 구슬·진자·판자 =====
   광학은 정적(순간)이고, 역학은 배치가 정해진 뒤 T_MAX초 동안 결정론적으로 풀린다.
   구슬은 모든 부품(판자·벽·렌즈·프리즘·거울·센서…)을 단단한 장애물로 본다. 타버린 종이는 사라진다. */
const MECH = (() => {
  const { W, H, PARTS } = OPT;
  const G = 4000;          // mm/s² — 작은 실험대 모형(화면에서 읽기 좋은 속도)
  const DT = 1 / 240;
  const T_MAX = 8;
  const REST_V = 80;       // 이보다 느린 법선 충돌은 튀지 않고 접촉을 유지한다
  const DEG = Math.PI / 180;

  const paramsOf = o => Object.assign({}, PARTS[o.type].defaults, o.params || {});
  const BOUNCE = { plank: 0.3, loadcell: 0.12, wall: 0.35, lensConvex: 0.55, lensConcave: 0.55, prism: 0.55, prismRight: 0.55, mirror: 0.4, lever: 0.3, slide: 0.3 };

  // 충돌 도형: 월드 좌표의 볼록 다각형. 프리즘은 삼각형, 나머지는 각 부품의 상자
  // burnAt: 타는 종이 → 사라지는 시각(s). 그때까지는 구슬을 받친다
  // 지레(움직임)와 슬라이드(원호)는 여기 없고 simulate가 따로 다룬다
  function shapesOf(objs, burnAt) {
    const out = [];
    for (const o of objs) {
      if (o.hidden || o.type === 'ball' || o.type === 'pendulum' || o.type === 'lever' || o.type === 'slide') continue;
      const until = o.type === 'paper' && burnAt && burnAt.has(o) ? burnAt.get(o) : Infinity;
      const p = paramsOf(o);
      const th = o.rot * DEG, c = Math.cos(th), s = Math.sin(th);
      const tx = ([x, y]) => [o.x + x * c - y * s, o.y + x * s + y * c];
      let local;
      if (o.type === 'prism') { const a = p.side / Math.sqrt(3); local = [[0, -a], [p.side / 2, a / 2], [-p.side / 2, a / 2]]; }
      else if (o.type === 'prismRight') { const h = p.side / 2; local = [[-h, -h], [h, h], [-h, h]]; }
      else { const b = PARTS[o.type].build(p).box; local = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]]; }
      out.push({ obj: o, pts: local.map(tx), e: BOUNCE[o.type] != null ? BOUNCE[o.type] : 0.35, until });
    }
    return out;
  }

  // 원과 볼록 다각형의 겁침: { d: 파고든 깊이, nx, ny: 다각형 밖으로 밀어낼 방향 } 또는 null
  function circlePoly(cx, cy, r, pts) {
    const n = pts.length;
    let inside = true, sign = 0, bestD2 = Infinity, bx = 0, by = 0, bnx = 0, bny = -1;
    for (let i = 0; i < n; i++) {
      const [ax, ay] = pts[i], [qx, qy] = pts[(i + 1) % n];
      const ex = qx - ax, ey = qy - ay, len2 = ex * ex + ey * ey;
      const cr = ex * (cy - ay) - ey * (cx - ax);
      if (cr !== 0) { if (sign === 0) sign = Math.sign(cr); else if (Math.sign(cr) !== sign) inside = false; }
      const t = Math.max(0, Math.min(1, ((cx - ax) * ex + (cy - ay) * ey) / len2));
      const px = ax + ex * t, py = ay + ey * t, d2 = (cx - px) ** 2 + (cy - py) ** 2;
      if (d2 < bestD2) { bestD2 = d2; bx = px; by = py; const l = Math.sqrt(len2); bnx = ey / l; bny = -ex / l; }
    }
    const dist = Math.sqrt(bestD2);
    if (inside) {
      // 중심이 안에 있다: 가장 가까운 변 밖으로 밀어낸다
      if (dist < 1e-9) { const o = sign > 0 ? -1 : 1; return { d: r, nx: bnx * o, ny: bny * o }; }
      return { d: r + dist, nx: (bx - cx) / dist, ny: (by - cy) / dist };
    }
    if (dist >= r) return null;
    return { d: r - dist, nx: (cx - bx) / dist, ny: (cy - by) / dist };
  }

  // 지레 막대의 현재 다각형
  function leverPts(q) {
    const ux = Math.cos(q.a), uy = Math.sin(q.a), nx = -uy * q.th / 2, ny = ux * q.th / 2;
    return [[q.px - q.l1 * ux - nx, q.py - q.l1 * uy - ny], [q.px + q.l2 * ux - nx, q.py + q.l2 * uy - ny], [q.px + q.l2 * ux + nx, q.py + q.l2 * uy + ny], [q.px - q.l1 * ux + nx, q.py - q.l1 * uy + ny]];
  }

  // 구르는 구슬의 접선 속도 갱신: 속이 찬 구는 접선 가속도가 5/7배, 작은 굴림 저항. 법선 성분은 그대로 둔다
  function roll(b, nx, ny) {
    const tx = -ny, ty = nx, gt = G * ty;
    let vt = b.vx * tx + b.vy * ty;
    const vn = b.vx * nx + b.vy * ny;
    vt -= (2 / 7) * gt * DT;
    const rr = 0.012 * G * DT;
    vt = Math.abs(vt) <= rr ? 0 : vt - Math.sign(vt) * rr;
    b.vx = vt * tx + vn * nx; b.vy = vt * ty + vn * ny;
  }

  function simulate(objs, burnAt) {
    const shapes = shapesOf(objs, burnAt);
    const balls = objs.filter(o => o.type === 'ball' && !o.hidden).map(o => { const p = paramsOf(o); return { obj: o, x: o.x, y: o.y, vx: 0, vy: 0, r: p.r, m: p.m, lost: false }; });
    const pends = objs.filter(o => o.type === 'pendulum' && !o.hidden).map(o => { const p = paramsOf(o); return { obj: o, px: o.x, py: o.y, L: p.L, r: p.r, m: p.m, a: p.a0 * DEG, w: 0, struck: null, maxSwing: Math.abs(p.a0) }; });
    const cells = objs.filter(o => o.type === 'loadcell' && !o.hidden).map(o => ({ obj: o, hit: null }));
    // 지레: 받침점 둘레 관성 I = m/(3L)·(l1³+l2³), 무게중심은 축에서 s = (l2-l1)/2
    const levers = objs.filter(o => o.type === 'lever' && !o.hidden).map(o => {
      const p = paramsOf(o), L = p.l1 + p.l2;
      return { obj: o, px: o.x, py: o.y, l1: p.l1, l2: p.l2, th: p.th, m: p.m, I: p.m / (3 * L) * (p.l1 ** 3 + p.l2 ** 3), s: (p.l2 - p.l1) / 2, amin: p.amin * DEG, amax: p.amax * DEG, a: o.rot * DEG, w: 0, lo: false, hi: false, maxTilt: 0 };
    });
    const slides = objs.filter(o => o.type === 'slide' && !o.hidden).map(o => {
      const p = paramsOf(o);
      return { obj: o, cx: o.x, cy: o.y, R: p.R, w: p.w, a0: Math.min(p.a0, p.a1) * DEG, a1: Math.max(p.a0, p.a1) * DEG, e: BOUNCE.slide };
    });
    const bobPos = q => [q.px + q.L * Math.sin(q.a), q.py + q.L * Math.cos(q.a)];
    const touch = (sh, t, speed, by) => {
      if (sh.obj.type !== 'loadcell') return;
      const cell = cells.find(k => k.obj === sh.obj);
      if (cell && !cell.hit) cell.hit = { t, speed, by };
    };
    const frames = [];
    const record = t => frames.push({ t, b: balls.map(b => [b.x, b.y, b.lost ? 1 : 0]), p: pends.map(q => q.a), l: levers.map(q => q.a) });
    record(0);
    const steps = Math.round(T_MAX / DT);
    for (let i = 1; i <= steps; i++) {
      const t = i * DT;
      // 진자: θ'' = -(g/L)·sinθ, 약한 공기 저항
      for (const q of pends) { q.w += -(G / q.L) * Math.sin(q.a) * DT; q.w *= 1 - 0.03 * DT; q.a += q.w * DT; }
      // 지레: 막대 자체의 무게 토크 → 회전. 멈춤쇠나 받침(바닥·종이)에 걸리면 그 방향으로는 더 못 돈다
      for (const q of levers) {
        q.w += q.s * Math.cos(q.a) * q.m * G / q.I * DT;
        q.w *= 1 - 0.4 * DT;
        const a0 = q.a;
        q.a += q.w * DT;
        q.lo = q.hi = false;
        if (q.a <= q.amin) { q.a = q.amin; if (q.w < 0) q.w = 0; q.lo = true; }
        if (q.a >= q.amax) { q.a = q.amax; if (q.w > 0) q.w = 0; q.hi = true; }
        if (q.a !== a0) {
          const ux = Math.cos(q.a), uy = Math.sin(q.a), ends = [[q.px - q.l1 * ux, q.py - q.l1 * uy], [q.px + q.l2 * ux, q.py + q.l2 * uy]];
          let hit = false;
          for (const sh of shapes) {
            if (t >= sh.until) continue;
            for (const [ex, ey] of ends) if (circlePoly(ex, ey, q.th / 2, sh.pts)) { hit = true; break; }
            if (hit) break;
          }
          if (hit) { if (q.a > a0) q.hi = true; else q.lo = true; q.a = a0; q.w = 0; }
        }
        q.maxTilt = Math.max(q.maxTilt, Math.abs(q.a - q.obj.rot * DEG) / DEG);
      }
      for (const b of balls) {
        if (b.lost) continue;
        b.vy += G * DT;
        b.x += b.vx * DT; b.y += b.vy * DT;
        for (const sh of shapes) {
          if (t >= sh.until) continue;
          const c = circlePoly(b.x, b.y, b.r, sh.pts);
          if (!c) continue;
          const speed = Math.hypot(b.vx, b.vy);
          b.x += c.nx * c.d; b.y += c.ny * c.d;
          const vn = b.vx * c.nx + b.vy * c.ny;
          if (vn < 0) {
            const e = -vn < REST_V ? 0 : sh.e;
            b.vx -= (1 + e) * vn * c.nx; b.vy -= (1 + e) * vn * c.ny;
            if (e === 0) roll(b, c.nx, c.ny);
          }
          touch(sh, t, speed, 'ball');
        }
        // 슬라이드: 원호 안쪽 면. 원의 법선으로 풀어 접선 속도가 깨지지 않게 한다
        for (const sl of slides) {
          const dx = b.x - sl.cx, dy = b.y - sl.cy, d = Math.hypot(dx, dy);
          if (d < 1e-9 || d <= sl.R - b.r || d >= sl.R + sl.w + b.r) continue;
          let ang = Math.atan2(dy, dx); while (ang < sl.a0) ang += 2 * Math.PI; while (ang >= sl.a0 + 2 * Math.PI) ang -= 2 * Math.PI;
          if (ang > sl.a1) continue;
          const inner = d < sl.R + sl.w / 2;
          const nx = inner ? -dx / d : dx / d, ny = inner ? -dy / d : dy / d;
          const depth = inner ? d - (sl.R - b.r) : (sl.R + sl.w + b.r) - d;
          b.x += nx * depth; b.y += ny * depth;
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) {
            const e = -vn < REST_V ? 0 : sl.e;
            b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
            if (e === 0) roll(b, nx, ny);
          }
        }
        // 지레: 움직이는 막대. 접촉점의 막대 속도를 기준으로 충격량을 주고받는다 (구슬의 무게가 토크가 된다)
        for (const q of levers) {
          const c = circlePoly(b.x, b.y, b.r, leverPts(q));
          if (!c) continue;
          b.x += c.nx * c.d; b.y += c.ny * c.d;
          const rx = b.x - c.nx * b.r - q.px, ry = b.y - c.ny * b.r - q.py;
          const sx = -q.w * ry, sy = q.w * rx;
          const vrel = (b.vx - sx) * c.nx + (b.vy - sy) * c.ny;
          if (vrel >= 0) continue;
          const e = -vrel < REST_V ? 0 : BOUNCE.lever;
          const rn = rx * c.ny - ry * c.nx;
          // 이 충격이 막대를 돌리려는 방향이 막혀 있으면 막대는 고정된 바닥과 같다
          const dir = -rn, fixed = (dir < 0 && q.lo) || (dir > 0 && q.hi);
          const k = 1 / b.m + (fixed ? 0 : rn * rn / q.I);
          const J = -(1 + e) * vrel / k;
          b.vx += J * c.nx / b.m; b.vy += J * c.ny / b.m;
          if (!fixed) q.w -= J * rn / q.I;
          if (e === 0) roll(b, c.nx, c.ny);
        }
        // 진자 추와의 충돌: 추는 줄에 매여 접선 방향으로만 움직인다.
        // 법선 방향 1차원 충돌로 풀되, 추의 유효 질량은 m/(t·n)² (축이 나머지 충격을 받는다)
        for (const q of pends) {
          const [qx, qy] = bobPos(q);
          const dx = b.x - qx, dy = b.y - qy, dist = Math.hypot(dx, dy), minD = b.r + q.r;
          if (dist >= minD || dist < 1e-9) continue;
          const nx = dx / dist, ny = dy / dist;
          b.x += nx * (minD - dist); b.y += ny * (minD - dist);
          const tx = Math.cos(q.a), ty = -Math.sin(q.a);
          const vbx = q.w * q.L * tx, vby = q.w * q.L * ty;
          const v1n = b.vx * nx + b.vy * ny, v2n = vbx * nx + vby * ny;
          if (v1n - v2n >= 0) continue;
          if (!q.struck) q.struck = { t, speed: Math.hypot(b.vx, b.vy) };
          let tn = tx * nx + ty * ny;
          if (Math.abs(tn) < 0.2) tn = tn < 0 ? -0.2 : 0.2;
          const m1 = b.m, m2 = q.m / (tn * tn), e = 0.92;
          const v1nP = (m1 * v1n + m2 * v2n - m2 * e * (v1n - v2n)) / (m1 + m2);
          const v2nP = (m1 * v1n + m2 * v2n + m1 * e * (v1n - v2n)) / (m1 + m2);
          b.vx += (v1nP - v1n) * nx; b.vy += (v1nP - v1n) * ny;
          q.w += (v2nP - v2n) / tn / q.L;
        }
        if (b.y > H + 60 || b.x < -60 || b.x > W + 60) b.lost = true;
      }
      // 구슬끼리의 충돌 (탄성, 운동량 보존)
      for (let a = 0; a < balls.length; a++) for (let c2 = a + 1; c2 < balls.length; c2++) {
        const A = balls[a], B = balls[c2];
        if (A.lost || B.lost) continue;
        const dx = B.x - A.x, dy = B.y - A.y, dist = Math.hypot(dx, dy), minD = A.r + B.r;
        if (dist >= minD || dist < 1e-9) continue;
        const nx = dx / dist, ny = dy / dist, push = (minD - dist) / 2;
        A.x -= nx * push; A.y -= ny * push; B.x += nx * push; B.y += ny * push;
        const v1 = A.vx * nx + A.vy * ny, v2 = B.vx * nx + B.vy * ny;
        if (v1 - v2 <= 0) continue;
        const e = 0.9, m1 = A.m, m2 = B.m;
        const v1P = (m1 * v1 + m2 * v2 - m2 * e * (v1 - v2)) / (m1 + m2);
        const v2P = (m1 * v1 + m2 * v2 + m1 * e * (v1 - v2)) / (m1 + m2);
        A.vx += (v1P - v1) * nx; A.vy += (v1P - v1) * ny; B.vx += (v2P - v2) * nx; B.vy += (v2P - v2) * ny;
      }
      // 추가 로드셀을 치는 경우 · 최대 진폭 기록
      for (const q of pends) {
        q.maxSwing = Math.max(q.maxSwing, Math.abs(q.a) / DEG);
        const [qx, qy] = bobPos(q);
        for (const sh of shapes) if (sh.obj.type === 'loadcell' && circlePoly(qx, qy, q.r, sh.pts)) touch(sh, t, Math.abs(q.w * q.L), 'bob');
      }
      if (i % 4 === 0) record(t);
    }
    return { frames, cells, balls, pends, levers, tEnd: T_MAX };
  }

  // 재생용: 시각 t의 보간된 프레임
  function frameAt(sim, t) {
    const F = sim.frames;
    if (t <= 0) return F[0];
    if (t >= sim.tEnd) return F[F.length - 1];
    const k = t / (F[1].t - F[0].t), i = Math.min(F.length - 2, Math.floor(k)), f = k - i;
    const A = F[i], B = F[i + 1];
    return { t, b: A.b.map((v, j) => [v[0] + (B.b[j][0] - v[0]) * f, v[1] + (B.b[j][1] - v[1]) * f, v[2] || B.b[j][2]]), p: A.p.map((v, j) => v + (B.p[j] - v) * f), l: A.l.map((v, j) => v + (B.l[j] - v) * f) };
  }

  const hasBodies = objs => objs.some(o => (o.type === 'ball' || o.type === 'pendulum' || o.type === 'loadcell' || o.type === 'lever') && !o.hidden);

  /* 한 배치의 전체 해답:
     1) 종이가 온전하고 구슬이 제자리에 있는 상태로 추적(Rpre) → 집광 판정 → 타는 종이는 BURN_T에 사라진다.
        탄 종이가 길을 열어 그 뒤의 종이에 빛이 닿으면 그 종이도 BURN_T 뒤에 탄다 (연쇄, 정적 상태에서 반복)
     2) 역학 시뮬레이션 (구슬은 종이가 사라질 때까지 그 위에 머물러 있다)
     3) 최종 상태(탄 종이 없음, 구슬은 멈춘 자리, 지레는 기운 각도)로 다시 추적(R) → 센서 판정은 이것으로.
        구슬이 비키거나 지레가 기울어 드러난 종이가 기준을 넘기면, 모두 멈춘 뒤 BURN_T에 타는 것으로 보고 2)부터 다시 */
  const BURN_T = 0.7;
  // 시뮬레이션에서 마지막으로 무언가 움직인 시각
  function settleTime(M) {
    const F = M.frames;
    for (let i = F.length - 1; i > 0; i--) {
      const A = F[i], B = F[i - 1];
      if (A.b.some((v, j) => Math.hypot(v[0] - B.b[j][0], v[1] - B.b[j][1]) > 0.5) || A.l.some((v, j) => Math.abs(v - B.l[j]) > 1e-3) || A.p.some((v, j) => Math.abs(v - B.p[j]) > 1e-3)) return A.t;
    }
    return 0;
  }
  function solve(objs) {
    const live = objs.filter(o => !o.hidden);
    const papers = live.filter(o => o.type === 'paper');
    papers.forEach(o => { o.burnt = false; });
    const burnAt = new Map(), heat = new Map();
    // 광선 Rk로 아직 안 탄 종이를 판정. 기준을 넘긴 종이는 tBurn에 사라진다. 새로 탄 종이가 있으면 true
    const judge = (Rk, tBurn) => {
      let any = false;
      for (const o of papers) {
        if (o.burnt) continue;
        const hits = Rk.sensorHits.get(o) || [];
        const h = { obj: o, hits, ...GAME.paperHeat(o, hits, Rk.emitted) };
        heat.set(o, h);
        if (h.ok) { o.burnt = true; burnAt.set(o, tBurn); any = true; }
      }
      return any;
    };
    const finalObjs = M => live.map(o => {
      if (!M) return o;
      if (o.type === 'lever') { const q = M.levers.find(k => k.obj === o); return { ...o, rot: q.a / DEG }; }
      if (o.type !== 'ball') return o;
      const b = M.balls.find(k => k.obj === o);
      return b.lost ? null : { ...o, x: b.x, y: b.y };
    }).filter(Boolean);

    // 1) 정적 연쇄
    const Rpre = OPT.trace(live);
    const rays = [{ t: 0, R: Rpre }];   // 재생 시각별 광선
    let Rk = Rpre, t = BURN_T;
    for (let i = 0; i < 6 && judge(Rk, t); i++) { Rk = OPT.trace(live); rays.push({ t, R: Rk }); t += BURN_T; }
    // 2) 역학 → 3) 최종 추적. 드러난 종이가 더 타면 다시
    let M = null, R = Rk, tFinal = rays[rays.length - 1].t;
    for (let i = 0; i < 3; i++) {
      M = hasBodies(live) ? simulate(live, burnAt) : null;
      if (!(burnAt.size || (M && M.balls.length))) break;
      R = OPT.trace(finalObjs(M));
      if (!M) break;
      const tBurn = settleTime(M) + BURN_T;
      if (!judge(R, tBurn)) break;
      tFinal = tBurn;
    }
    const last = rays[rays.length - 1];
    if (last.t === tFinal) last.R = R; else rays.push({ t: tFinal, R });
    return { Rpre, R, M, rays, paperRes: papers.map(o => heat.get(o)), burnt: burnAt.size > 0 };
  }

  /* ---------- 단단한 배치 ----------
     모든 물체는 단단해서 서로 파고들 수 없다. 부품을 놓거나 옮길 때 다른 물체(고정 장치·구슬·다른 부품)와
     겹치는 자세는 거부한다. 받침대 안으로 판자를 밀어 넣어 구슬을 들어 올리는 식의 조작을 막는다. */

  // 두 볼록 다각형이 겹치는가 (분리축 정리). 변끼리 맞닿기만 하면 겹침이 아니다
  function polyOverlap(A, B) {
    for (const P of [A, B]) {
      for (let i = 0; i < P.length; i++) {
        const [ax, ay] = P[i], [bx, by] = P[(i + 1) % P.length];
        const nx = by - ay, ny = ax - bx;
        let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
        for (const [x, y] of A) { const d = x * nx + y * ny; if (d < minA) minA = d; if (d > maxA) maxA = d; }
        for (const [x, y] of B) { const d = x * nx + y * ny; if (d < minB) minB = d; if (d > maxB) maxB = d; }
        if (maxA <= minB + 1e-9 || maxB <= minA + 1e-9) return false;
      }
    }
    return true;
  }

  // 슬라이드 원호 띠를 이루는 사각형들 (월드 좌표)
  function slideQuads(o) {
    const p = paramsOf(o), n = Math.max(4, Math.ceil(Math.abs(p.a1 - p.a0) / 6)), out = [];
    const at = (r, a) => [o.x + r * Math.cos(a), o.y + r * Math.sin(a)];
    for (let i = 0; i < n; i++) {
      const fa = (p.a0 + (p.a1 - p.a0) * i / n) * DEG, fb = (p.a0 + (p.a1 - p.a0) * (i + 1) / n) * DEG;
      out.push([at(p.R, fa), at(p.R, fb), at(p.R + p.w, fb), at(p.R + p.w, fa)]);
    }
    return out;
  }

  // 물체 하나가 차지하는 단단한 영역(시작 상태 기준): 볼록 다각형들과 원들 [cx, cy, r]
  function solidOf(o) {
    const polys = [], circles = [], p = paramsOf(o);
    if (o.type === 'ball') circles.push([o.x, o.y, p.r]);
    else if (o.type === 'pendulum') {
      const a = p.a0 * DEG, bx = o.x + p.L * Math.sin(a), by = o.y + p.L * Math.cos(a), nx = Math.cos(a), ny = -Math.sin(a);
      circles.push([bx, by, p.r]);
      polys.push([[o.x - nx, o.y - ny], [o.x + nx, o.y + ny], [bx + nx, by + ny], [bx - nx, by - ny]]); // 줄
    } else if (o.type === 'lever') {
      polys.push(leverPts({ px: o.x, py: o.y, l1: p.l1, l2: p.l2, th: p.th, a: o.rot * DEG }));
      polys.push([[o.x, o.y + 2], [o.x - 14, o.y + 26], [o.x + 14, o.y + 26]]); // 받침대
      polys.push([[o.x - 20, o.y + 24], [o.x + 20, o.y + 24], [o.x + 20, o.y + 30], [o.x - 20, o.y + 30]]);
    } else if (o.type === 'slide') polys.push(...slideQuads(o));
    else polys.push(shapesOf([o], null)[0].pts);
    return { polys, circles };
  }

  // 부품 o를 지금 자세로 두면 겹치는 다른 물체, 없으면 null
  function overlaps(o, objs) {
    const me = solidOf(o);
    for (const k of objs) {
      if (k === o || k.hidden) continue;
      const other = solidOf(k);
      for (const A of me.polys) {
        for (const B of other.polys) if (polyOverlap(A, B)) return k;
        for (const [cx, cy, r] of other.circles) if (circlePoly(cx, cy, r, A)) return k;
      }
      for (const [cx, cy, r] of me.circles) {
        for (const B of other.polys) if (circlePoly(cx, cy, r, B)) return k;
        for (const [qx, qy, qr] of other.circles) if (Math.hypot(cx - qx, cy - qy) < r + qr) return k;
      }
    }
    return null;
  }

  return { G, T_MAX, BURN_T, simulate, solve, frameAt, hasBodies, circlePoly, shapesOf, solidOf, overlaps };
})();

(() => {

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  const C = {
    bench: '#12161b', hole: '#06080a', holeRim: 'rgba(255,255,255,0.055)',
